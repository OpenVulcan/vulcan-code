# Evaluate the dependency graph for every platform shipped by Vulcan Code.
# 对 Vulcan Code 实际发布的全部平台评估依赖图。
[graph]
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
all-features = false
no-default-features = false

# Reject known vulnerabilities and yanked crates unless an exception has an explicit reason.
# 拒绝已知漏洞和被撤回的包；任何例外都必须显式说明原因。
[advisories]
ignore = [
    # GTK3's glib-macros and gtk3-macros still require this proc macro on Linux native tray builds.
    # Linux 原生托盘的 GTK3 所用 glib-macros 和 gtk3-macros 仍依赖此过程宏。
    { id = "RUSTSEC-2024-0370", reason = "Linux native tray GTK3 macros still depend on proc-macro-error 1; review when upgrading tray-icon or Tao" },
    # The permission-judge tokenizer still uses this compile-time macro; it is unmaintained, not vulnerable.
    # 权限判定分词器仍使用此编译期宏；它只是停止维护，并无漏洞。
    { id = "RUSTSEC-2024-0436", reason = "tokenizers 0.23 still depends on paste; review when upgrading tokenizers" },
]

# Keep the allowlist intentionally conservative and extend it only after legal review.
# 许可证白名单保持审慎，新增许可证必须经过明确审查。
[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

# Workspace crates are first-party code and are governed by repository policy.
# 工作区包属于第一方代码，由仓库自身策略管理。
[licenses.private]
ignore = true

# Report transitive duplicates without turning historical dependency divergence into a hard failure.
# 报告连锁依赖中的重复版本，但不把历史依赖分歧直接升级为阻断错误。
[bans]
multiple-versions = "warn"
# Workspace inheritance and local path dependencies are represented as wildcard requirements by cargo-deny.
# cargo-deny 会把工作区继承与本地路径依赖表示为通配版本；外部版本完整性由仓库策略脚本单独阻断。
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

# Only crates.io packages are accepted; Git dependencies require an explicit reviewed exception.
# 仅允许 crates.io 包；Git 依赖必须经过显式审查并加入例外。
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
