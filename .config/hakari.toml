# This file contains settings for `cargo hakari`.
# See https://docs.rs/cargo-hakari/latest/cargo_hakari/config for a full list of options.

hakari-package = "workspace-hack"

# Format version for hakari's output. Version 4 requires cargo-hakari 0.9.22 or above.
dep-format-version = "4"

# Setting workspace.resolver = "2" or higher in the root Cargo.toml is HIGHLY recommended.
# Hakari works much better with the v2 resolver. (The v2 and v3 resolvers are identical from
# hakari's perspective, so you're welcome to set either.)
#
# For more about the new feature resolver, see:
# https://blog.rust-lang.org/2021/03/25/Rust-1.51.0.html#cargos-new-feature-resolver
resolver = "3"

# Add triples corresponding to platforms commonly used by developers here.
# https://doc.rust-lang.org/rustc/platform-support.html
platforms = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

# The service owns optional native tray dependencies; headless libraries must not inherit GUI dependencies.
# 服务持有可选原生托盘依赖，无界面库不得继承 GUI 依赖。
# The native LanceDB library is loaded at run time; its LanceDB-only features (arrow compression, csv, json,
# ffi) must not be unified into the workspace, and workspace changes must not alter its build inputs.
# 原生 LanceDB 库在运行时加载；其 LanceDB 专属特性（arrow 压缩、csv、json、ffi）不得统一进工作区，
# 工作区的变化也不得改变其构建输入。
[traversal-excludes]
workspace-members = ["vulcan-code-service", "vulcan-lancedb-native"]

# The native library and the workspace crates it links never depend on workspace-hack, so `cargo hakari
# manage-deps` must not add it back; otherwise the library would still reach workspace-hack transitively.
# 原生库及其链接的工作区 crate 从不依赖 workspace-hack，因此 `cargo hakari manage-deps` 不得将其加回；
# 否则原生库仍会间接依赖 workspace-hack。
#
# The install core is also linked by the static setup program, which must not compile the workspace-wide
# feature set; it keeps only its own small dependency list.
# 安装核心同样链接进静态安装器，安装器不得编译整个工作区的特性集合；它只保留自己的少量依赖。
[final-excludes]
workspace-members = ["vulcan-lancedb-native", "vulcan-lancedb-contract", "vulcan-file-ownership", "vulcan-install-core"]

# Write out exact versions rather than a semver range. (Defaults to false.)
# exact-versions = true
