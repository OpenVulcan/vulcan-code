# Keep nextest's test-process concurrency bounded on developer machines.
# 限制 nextest 的测试进程并发度，避免开发机被测试进程占满。
[profile.default]
test-threads = 4

# Shared provider manifests, process registries, and loopback ports must not race across test processes.
# 共享供应商清单、进程注册表与回环端口不得在测试进程之间并发争用。
[test-groups.shared-runtime-resources]
max-threads = 1

# Keep only resource-sensitive tests in the serial group; all remaining tests retain bounded parallelism.
# 仅把资源敏感测试放入串行组；其余测试继续使用受限并行。
[[profile.default.overrides]]
filter = '''
test(/provider_manifest|bundled_manifest|bind_ports|loopback|websocket|tcp_listener|service_registry/)
| (package(vulcan-service-kernel) & test(registry))
'''
test-group = "shared-runtime-resources"

# The fast profile is the local inner-loop entry (`make test`). It skips tests whose cost is real
# elapsed time, real VMM controllers, or full plugin lifecycles; `make test full` runs them.
# fast 配置是本地内循环入口（`make test`）。它跳过成本来自真实流逝时间、真实 VMM 控制器或完整插件
# 生命周期的测试；`make test full` 会执行它们。
[profile.fast]
default-filter = '''
not (package(vulcan-service-kernel) & (
    test(/^native_vmm::driver::lexical_driver_tests::real_controller_(replacement_policy|hybrid_policy|precheck_history_policy|weibull_policy)/)
    | test(/^skills_services::vulcan_plugin_lifecycle::generation_tests::published::/)
    | test(/^skills_services::local_plugin_update::target_handoff::predecessor_restoration::/)
    | test(/::real_host_storage_human_jobs/)
))
'''
