# Keep vendored MSVC C dependencies aligned with Rust's dynamic C runtime.
# 让通过 MSVC 编译的内置 C 依赖统一使用 Rust 默认的动态 C 运行时。
# Keep Cargo compiler process fan-out bounded on developer machines.
# 限制开发机上的 Cargo 编译进程并发度。
[build]
jobs = 4

# Keep the test harness conservative while allowing an explicit shell override.
# 保持测试 harness 并发度适中，同时允许命令行环境变量显式覆盖。
[env]
RUST_TEST_THREADS = { value = "4", force = false }

# Keep vendored MSVC C dependencies aligned with Rust's dynamic C runtime.
# 让通过 MSVC 编译的内置 C 依赖统一使用 Rust 默认的动态 C 运行时。
CL = { value = "/MD", force = false }

# Point protoc at the vendored binary so third-party crates whose build scripts invoke protoc
# directly (for example `lance-encoding`, pulled in by `lancedb`) build without a system-wide
# protobuf installation. `PROTOC_INCLUDE` is required because vanilla `prost-build` only adds the
# include directory when it sourced protoc itself via `protoc-bin-vendored`.
# 指向随仓库提供的 protoc，使那些直接调用 protoc 的第三方 crate 构建脚本（例如 `lancedb`
# 引入的 `lance-encoding`）无需系统级 protobuf 安装即可构建。必须同时设置 `PROTOC_INCLUDE`，
# 因为普通 `prost-build` 只在它自行通过 `protoc-bin-vendored` 取得 protoc 时才附带 include 目录。
# Cargo resolves relative=true from the repository root; Windows Command adds .exe when needed.
# Cargo 将 relative=true 路径基于仓库根目录解析；Windows Command 按需补充 .exe。
PROTOC = { value = ".cargo/protoc/bin/protoc", relative = true, force = false }
PROTOC_INCLUDE = { value = ".cargo/protoc/include", relative = true, force = false }

# aws-lc-sys, unified into every workspace build by workspace-hack, declares its jitterentropy functions
# with dllexport. MSVC would then write an unused import library and export file for every linked
# executable, and a localized linker reports that as a linker_messages warning. Nothing links against
# workspace executables, and rustc loads proc-macro DLLs directly, so both files are suppressed for
# every MSVC link here instead of in per-crate build scripts.
# workspace-hack 将 aws-lc-sys 统一进全部工作区构建，其 jitterentropy 函数以 dllexport 声明。MSVC 因此会为
# 每个链接出的可执行文件写出无用的导入库与导出文件，本地化链接器会将其报告为 linker_messages 警告。没有任何
# 目标链接工作区可执行文件，rustc 直接加载过程宏 DLL，因此在此对全部 MSVC 链接统一抑制这两个文件，
# 而不是在各 crate 的构建脚本中分别处理。
[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "link-arg=/NOIMPLIB", "-C", "link-arg=/NOEXP"]
