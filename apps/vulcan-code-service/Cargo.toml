[package]
name = "vulcan-code-service"
description = "Independent Vulcan Code service and user-session tray host."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { workspace = true, features = [], optional = true }

[dependencies]
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { workspace = true, features = ["tray-icon", "image-png"], optional = true }
tauri-plugin-notification = { workspace = true, optional = true }
notify-rust = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "signal"] }
uuid.workspace = true
vulcan-host-tools.workspace = true
vulcan-provider-adapters.workspace = true
vulcan-runtime-assets.workspace = true
vulcan-service-api.workspace = true
vulcan-service-host.workspace = true
vulcan-service-kernel.workspace = true

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["desktop-tray"]
desktop-tray = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-notification", "dep:notify-rust", "dep:windows"]
test-support = ["vulcan-runtime-assets/test-support", "vulcan-service-kernel/test-support"]

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, optional = true, features = ["Data_Xml_Dom", "UI_Notifications", "Win32_Foundation", "Win32_Security", "Win32_Storage_EnhancedStorage", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Console", "Win32_System_Registry", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem"] }

[dev-dependencies]
tempfile.workspace = true

# Only the private Windows notification interop module permits audited COM calls.
# 仅私有 Windows 通知互操作模块允许经过审核的 COM 调用。
[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
