[package]
name = "vulcan-code-service"
description = "Independent Vulcan Code service and user-session tray host."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[build-dependencies]
winresource = { workspace = true, optional = true }

[dependencies]
vulcan-product-info.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tao = { workspace = true, optional = true }
tray-icon = { workspace = true, optional = true }
png = { workspace = true, optional = true }
notify-rust = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "signal"] }
uuid.workspace = true
vulcan-host-tools.workspace = true
vulcan-i18n = { workspace = true, optional = true }
vulcan-provider-adapters.workspace = true
vulcan-runtime-assets.workspace = true
vulcan-service-api.workspace = true
vulcan-service-host.workspace = true
vulcan-service-kernel.workspace = true
vulcan-service-runtime.workspace = true

[features]
default = ["desktop-tray"]
desktop-tray = ["dep:tao", "dep:tray-icon", "dep:png", "dep:vulcan-i18n", "dep:winresource", "dep:notify-rust", "dep:windows"]
test-support = ["vulcan-runtime-assets/test-support", "vulcan-service-kernel/test-support"]

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, optional = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console"] }

[dev-dependencies]
vulcan-runtime-assets = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

# Only the private Windows Debug console module permits audited native calls.
# 仅私有 Windows Debug 控制台模块允许经过审核的原生调用。
[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
