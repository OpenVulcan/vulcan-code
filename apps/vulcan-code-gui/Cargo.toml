[package]
name = "vulcan-code-gui"
description = "Rust + iced based AI coding desktop foundation."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
iced.workspace = true
iced_aw.workspace = true
iced_fonts.workspace = true
async-stream = "0.3.6"
dirs = "6.0.0"
futures-util = "0.3.31"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
rfd = "0.15.4"
rig.workspace = true
vulcan-agent-view.workspace = true
vulcan-mcp-runtime.workspace = true
vulcan-tools-manager.workspace = true
vldb-controller-client.workspace = true
luaskills.workspace = true
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9"
time = { version = "0.3.44", features = ["formatting", "local-offset", "macros"] }
tokio = { version = "1.52.2", features = ["rt", "sync", "time"] }
unicode-segmentation = "1.12.0"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
