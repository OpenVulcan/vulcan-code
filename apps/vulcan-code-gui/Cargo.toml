[package]
name = "vulcan-code-gui"
description = "Rust + iced based AI coding desktop foundation."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
iced.workspace = true
iced_aw.workspace = true
iced_fonts.workspace = true
iced_runtime = { git = "https://github.com/lingeasy/iced.git", branch = "vulcan-code", package = "iced_runtime" }
async-stream = "0.3.6"
arboard = "3.6.1"
base64 = "0.22.1"
dirs = "6.0.0"
encoding_rs = "0.8.35"
filetime = "0.2.26"
futures-util = "0.3.31"
png = "0.17.16"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
rfd = "0.15.4"
rodio = "0.20.1"
vulcan-agent-view.workspace = true
vulcan-change-set.workspace = true
vulcan-markdown.workspace = true
vulcan-mcp-runtime.workspace = true
vulcan-tools-manager.workspace = true
vulcan-core.workspace = true
vulcan-workbench-model.workspace = true
vulcan-workspace-store.workspace = true
vulcan-runtime-assets.workspace = true
vulcan-provider-config.workspace = true
vulcan-context.workspace = true
vulcan-context-compaction.workspace = true
vulcan-file-watcher.workspace = true
vulcan-prompt-composer.workspace = true
vldb-controller-client.workspace = true
luaskills.workspace = true
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9"
sys-locale = "0.3.2"
time = { version = "0.3.44", features = ["formatting", "local-offset", "macros"] }
tokio = { version = "1.52.2", features = ["rt", "sync", "time", "net", "io-util"] }
unicode-segmentation = "1.12.0"
uuid.workspace = true
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4.1"
