[package]
name = "vulcan-code-gui"
description = "Rust + iced based AI coding desktop foundation."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
iced.workspace = true
iced_aw = { version = "0.14.1", default-features = false, features = ["context_menu"] }
iced_fonts = { version = "0.3.0", default-features = false, features = ["codicon", "fontawesome", "lucide"] }
async-stream = "0.3.6"
dirs = "6.0.0"
futures-util = "0.3.31"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
rfd = "0.15.4"
rig.workspace = true
rig-compose.workspace = true
rig-mcp.workspace = true
vulcan-agent-view.workspace = true
vldb-controller-client.workspace = true
luaskills.workspace = true
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
time = { version = "0.3.44", features = ["formatting", "local-offset", "macros"] }
unicode-segmentation = "1.12.0"
