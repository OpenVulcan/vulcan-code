[package]
name = "vulcan-code-tui"
description = "Terminal user interface client for the Vulcan Code core service."
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
authors = ["OpenVulcan"]
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "vulcan-tui"
path = "src/main.rs"

[[bin]]
name = "vulcan-tui-i18n"
path = "src/bin/vulcan-tui-i18n.rs"

[dependencies]
anyhow = "1"
ratatui = "0.30"
ratatui-textarea = "0.9"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
# Plain-HTTP and WebSocket clients for the loopback core service; no TLS is needed on 127.0.0.1.
# 访问本机回环核心服务的纯 HTTP 与 WebSocket 客户端；127.0.0.1 上无需 TLS。
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
unicode-width = "0.2"
ureq = { version = "3", default-features = false }
