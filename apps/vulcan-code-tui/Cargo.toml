[package]
name = "vulcan-code-tui"
description = "Terminal user interface client for the Vulcan Code core service."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "vulcan-tui"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
# Encodes copies for the OSC 52 clipboard sequence.
# 为 OSC 52 剪贴板序列编码复制内容。
base64.workspace = true
# Formats provider-task timestamps as UTC without reading the host clock.
# 以 UTC 格式化供应商任务时间戳，无需读取宿主时钟。
chrono.workspace = true
ratatui.workspace = true
ratatui-textarea.workspace = true
serde.workspace = true
serde_json.workspace = true
# Plain-HTTP and WebSocket clients for the loopback core service; no TLS is needed on 127.0.0.1.
# 访问本机回环核心服务的纯 HTTP 与 WebSocket 客户端；127.0.0.1 上无需 TLS。
tungstenite.workspace = true
unicode-width.workspace = true
ureq.workspace = true
# Typed HTML source ownership and safe native viewer navigation.
# 强类型 HTML 源码归属与安全原生查看器导航。
uuid.workspace = true
url.workspace = true
open.workspace = true
# Context-window input parsing and fit rule shared with the service.
# 与服务共用的上下文窗口输入解析与适配规则。
vulcan-ai-contract.workspace = true
vulcan-i18n.workspace = true
vulcan-product-info.workspace = true
# Shared service DTOs and v1 conversation event types; the TUI reads the wire through them.
# 共享服务 DTO 与 v1 会话事件类型；TUI 通过它们读取传输数据。
vulcan-service-api.workspace = true
vulcan-session-core.workspace = true
vulcan-tool-chain.workspace = true
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[target.'cfg(windows)'.dependencies]
crossterm_winapi.workspace = true

[dev-dependencies]
vulcan-runtime-assets = { workspace = true, features = ["test-support"] }
regex.workspace = true

[lints]
workspace = true
