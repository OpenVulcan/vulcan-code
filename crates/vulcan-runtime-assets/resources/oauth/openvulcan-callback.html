<!doctype html>
<html lang="{{locale}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>{{title}} · OpenVulcan</title>
  <link rel="icon" href="data:,">
  <style>
    /* Brand colors and geometry follow openvulcan-web/src/styles.css and src/site/brand.tsx.
       品牌颜色与几何遵循 openvulcan-web/src/styles.css 及 src/site/brand.tsx。 */
    :root {
      color-scheme: dark;
      color: #f4f5f6;
      background: #0b0d10;
      font-family: "Geist Variable", "Geist", "PingFang SC", "Microsoft YaHei UI", system-ui, sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none;
      background-image: radial-gradient(#ffffff14 1px, transparent 1px);
      background-size: 24px 24px;
      mask-image: radial-gradient(ellipse at 50% 30%, black, transparent 70%);
    }
    a { color: inherit; text-decoration: none; }
    header { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 28px clamp(20px, 5vw, 72px); }
    .brand { font-size: 21px; font-weight: 600; letter-spacing: -.022em; white-space: nowrap; }
    .brand svg { height: 1.006em; width: auto; margin-right: .221em; vertical-align: -.01em; }
    .edition { border: 1px solid #262a31; border-radius: 6px; padding: 6px 10px; color: #a4a9b1; font-size: 12px; }
    main { position: relative; width: min(540px, calc(100% - 40px)); margin: auto; padding: 32px 0 64px; }
    .card { padding: clamp(24px, 6vw, 44px); border: 1px solid #262a31; border-radius: 16px; background: #1a1c21f0; box-shadow: 0 30px 80px #0004; text-align: center; }
    .status-icon { width: 64px; height: 64px; display: grid; place-items: center; margin: 0 auto 28px; border: 1px solid #3fb97a40; border-radius: 20px; color: #6bd9a0; background: #3fb97a12; }
    .status-icon svg { width: 30px; height: 30px; }
    .failure-icon, [data-outcome="accepted"] .failure-icon { display: none; }
    body:not([data-outcome="accepted"]) .success-icon { display: none; }
    body:not([data-outcome="accepted"]) .failure-icon { display: block; }
    body:not([data-outcome="accepted"]) .status-icon { color: #ff946b; border-color: #ff652740; background: #ff652712; }
    .eyebrow { color: #a4a9b1; font-size: 11px; letter-spacing: .16em; font-weight: 600; }
    h1 { margin: 12px 0 16px; font-size: clamp(25px, 5vw, 30px); line-height: 1.3; letter-spacing: -.035em; font-weight: 600; }
    .description { margin: 0; color: #a4a9b1; font-size: 14px; line-height: 1.8; overflow-wrap: anywhere; }
    .next-step { display: flex; align-items: flex-start; gap: 12px; margin: 28px 0; padding: 16px; border: 1px solid #30343c; border-radius: 10px; background: #111317; text-align: left; }
    .next-step svg { flex: none; width: 20px; height: 20px; margin-top: 2px; color: #ff6a2e; }
    .next-step strong { display: block; margin-bottom: 5px; font-size: 13px; font-weight: 500; }
    .next-step p { margin: 0; color: #a4a9b1; font-size: 12px; line-height: 1.7; }
    button { width: 100%; border: 1px solid transparent; border-radius: 8px; padding: 12px 18px; background: #f44e1c; color: #0b0d10; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
    button:hover { background: #ff6527; }
    :focus-visible { outline: 2px solid #ff946b; outline-offset: 4px; }
    .close-help { margin: 16px 0 0; font-size: 12px; line-height: 1.7; color: #a4a9b1; }
    [hidden] { display: none; }
    footer { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 22px; color: #a4a9b1; font-size: 11px; line-height: 1.7; text-align: center; }
    footer svg { width: 14px; height: 14px; flex: none; }
    @media (max-width: 380px) { header { padding: 20px; } .edition { max-width: 105px; text-align: center; } }
  </style>
</head>
<body data-outcome="{{outcome}}">
  <header>
    <a class="brand" href="{{site_url}}" rel="noreferrer" aria-label="OpenVulcan">
      <svg viewBox="32 29 232 259" aria-hidden="true"><defs><linearGradient id="flame" x1="0%" y1="100%" x2="100%" y2="0%"><stop offset="0%" stop-color="#FF6527"/><stop offset="100%" stop-color="#F44E1C"/></linearGradient></defs><path d="M 2 0 L 84 0 C 88 0 91 1 95 5 L 153 76 C 159 83 159 95 153 102 L 95 173 C 91 177 88 178 84 178 L 2 178 L 78 89 Z" fill="currentColor" transform="translate(30 110)"/><path d="M 73 0 C 64 14 51 28 38 40 C 21 55 7 68 2 87 C -2 107 8 129 25 150 C 39 134 53 119 67 107 C 82 95 91 79 93 60 C 95 40 86 18 73 0 Z" fill="url(#flame)" transform="translate(169 29)"/></svg>OpenVulcan
    </a>
    <span class="edition">{{edition}}</span>
  </header>
  <main>
    <section class="card" aria-labelledby="result-title">
      <div class="status-icon" aria-hidden="true">
        <svg class="success-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg>
        <svg class="failure-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v6m0 4h.01"/></svg>
      </div>
      <span class="eyebrow">VULCAN CODE</span>
      <h1 id="result-title">{{title}}</h1>
      <p class="description">{{description}}</p>
      <div class="next-step">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/></svg>
        <div><strong>{{next_title}}</strong><p>{{next_description}}</p></div>
      </div>
      <button id="close-page" type="button">{{close}}</button>
      <p id="close-help" class="close-help" hidden role="status">{{close_help}}</p>
    </section>
    <footer><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 3 4 6v6c0 5 8 9 8 9s8-4 8-9V6Z"/><path d="m8 12 3 3 5-6"/></svg>{{footer}}</footer>
  </main>
  <script>
    // Remove the one-time code from this history entry without another callback request.
    // 从当前历史条目移除一次性授权码，且不再发起回调请求。
    history.replaceState(null, "", location.pathname);
    // Close only on an explicit click; browsers that block closing retain manual guidance.
    // 仅在明确点击后关闭；浏览器阻止关闭时保留手动操作说明。
    document.getElementById("close-page").addEventListener("click", function closePage() {
      window.close();
      document.getElementById("close-help").hidden = false;
    });
  </script>
</body>
</html>
