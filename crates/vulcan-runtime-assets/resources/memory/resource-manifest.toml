manifest_version = 1
resource_package_version = "0.1.0"
minimum_core_version = "0.1.0"

[schema_versions]
prompts = 1
pii_rules = 1
noise_rules = 1

[defaults]
prompt_bundle = "default_en"
pii_language = "zh-CN"
noise_language = "zh-CN"
prompt_aliases_default_en = ["", "default", "en", "english", "default_en"]
prompt_aliases_default_cn = ["cn", "zh", "zh-cn", "zh_hans", "chinese", "default_cn"]

[layering]
prompt_bundle = "selected_user_bundle_replaces_system_bundle_else_system_bundle"
pii_bundle = "user_language_or_common_bundle_replaces_same_system_bundle"
noise_bundle = "user_file_precedes_system_file_then_language_category_overrides_common_category"

[prompts]
bundles = ["default_cn", "default_en"]
required_scene_files = [
  "precheck_l1_main.md",
  "precheck_l2_main.md",
  "postaction_l1_main.md",
  "postaction_l2_main.md",
  "profile_instruction_main.md",
]

