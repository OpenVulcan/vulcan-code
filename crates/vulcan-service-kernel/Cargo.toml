[package]
name = "vulcan-service-kernel"
description = "Core service kernel for Vulcan Code WebUI hosts."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
base64 = "0.22.1"
dirs.workspace = true
encoding_rs = "0.8.35"
futures-util = "0.3.31"
ignore.workspace = true
jsonschema.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
time = { version = "0.3.44", features = ["formatting", "local-offset", "macros", "serde"] }
tokio = { workspace = true, features = ["process", "rt-multi-thread"] }
uuid.workspace = true
vldb-controller-client.workspace = true
vulcan-agent-runtime.workspace = true
vulcan-ai-contract.workspace = true
vulcan-llm-core.workspace = true
keyring.workspace = true
vulcan-provider-adapters.workspace = true
luaskills.workspace = true
sha2.workspace = true
vulcan-context.workspace = true
vulcan-context-compaction.workspace = true
vulcan-context-injection.workspace = true
vulcan-file-watcher.workspace = true
vulcan-core.workspace = true
vulcan-host-tools.workspace = true
vulcan-hooks.workspace = true
vulcan-luaskills-config.workspace = true
vulcan-provider-config.workspace = true
vulcan-plugin-runtime.workspace = true
vulcan-prompt-skills.workspace = true
vulcan-prompt-composer.workspace = true
vulcan-runtime-assets.workspace = true
vulcan-service-api.workspace = true
vulcan-service-host.workspace = true
vulcan-service-runtime.workspace = true
vulcan-session-boundary.workspace = true
vulcan-session-core.workspace = true
vulcan-subagent-core.workspace = true
vulcan-task-session.workspace = true
vulcan-tools-manager.workspace = true
vulcan-vmm.workspace = true
vulcan-workbench-model.workspace = true
vulcan-workspace-store.workspace = true

[target.'cfg(windows)'.dependencies]
vulcan-windows-console-helper = { path = "../vulcan-windows-console-helper" }

[dev-dependencies]
tempfile = "3.27.0"
# Enables the provider runtime HTTP-client injection seam for signed transport E2E tests.
# 为签名传输 E2E 测试启用供应商运行时 HTTP 客户端注入接缝。
vulcan-provider-adapters = { workspace = true, features = ["test-support"] }
# HTTPS loopback server for the local signing-server E2E (plan §R7.14).
# 供本地签名服务器 E2E 使用的 HTTPS 回环服务器（方案 §R7.14）。
rcgen = "0.13"
tokio-rustls = "0.26"
