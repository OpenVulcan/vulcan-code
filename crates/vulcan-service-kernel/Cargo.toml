[package]
name = "vulcan-service-kernel"
description = "Core service kernel for Vulcan Code WebUI hosts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
test-support = []

[dependencies]
async-trait.workspace = true
base64.workspace = true
dirs.workspace = true
encoding_rs.workspace = true
futures-util.workspace = true
ignore.workspace = true
iana-time-zone.workspace = true
jsonschema.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
time = { workspace = true, features = ["formatting", "local-offset", "macros", "serde"] }
tokio = { workspace = true, features = ["process", "rt-multi-thread"] }
uuid.workspace = true
vulcan-agent-runtime.workspace = true
vulcan-ai-contract.workspace = true
vulcan-context-engine = { workspace = true, features = ["host-ai-contract"] }
vulcan-memorymesh-core.workspace = true
vulcan-llm-core.workspace = true
keyring.workspace = true
vulcan-provider-adapters.workspace = true
luaskills.workspace = true
hex.workspace = true
sha2.workspace = true
tracing.workspace = true
vulcan-context.workspace = true
vulcan-context-compaction.workspace = true
vulcan-context-injection.workspace = true
vulcan-change-set.workspace = true
vulcan-file-watcher.workspace = true
vulcan-core.workspace = true
vulcan-host-tools.workspace = true
vulcan-hooks.workspace = true
# In-process LanceDB engine that serves plugin and VMM vector storage without a controller process.
# 在无控制器进程的情况下服务插件与 VMM 向量存储的进程内 LanceDB 引擎。
vulcan-lancedb-engine.workspace = true
vulcan-luaskills-config.workspace = true
vulcan-provider-config.workspace = true
vulcan-plugin-runtime.workspace = true
vulcan-prompt-skills.workspace = true
vulcan-prompt-composer.workspace = true
vulcan-runtime-assets.workspace = true
vulcan-service-api.workspace = true
vulcan-service-host.workspace = true
vulcan-service-runtime.workspace = true
vulcan-session-boundary.workspace = true
vulcan-session-core.workspace = true
# In-process SQLite engine that serves plugin relational storage without a controller process.
# 在无控制器进程的情况下服务插件关系存储的进程内 SQLite 引擎。
vulcan-sqlite-engine.workspace = true
vulcan-subagent-core.workspace = true
vulcan-task-session.workspace = true
vulcan-tools-manager.workspace = true
vulcan-vmm.workspace = true
vulcan-workbench-model.workspace = true
vulcan-workspace-store.workspace = true
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[target.'cfg(windows)'.dependencies]
vulcan-process-lifecycle.workspace = true

[dev-dependencies]
# Isolates full startup and restart tests without changing user-profile environment variables.
# 隔离完整启动和重启测试，不修改用户主目录环境变量。
vulcan-runtime-assets = { workspace = true, features = ["test-support"] }
# Parses explicitly authorized live-test configuration without invoking mutating startup recovery.
# 解析明确授权的真实测试配置，不调用会修改配置的启动恢复流程。
toml.workspace = true
# Exposes the deterministic HostAI Port for VCE adapter lifecycle tests only.
# 仅为 VCE 适配器生命周期测试暴露确定性 HostAI Port。
vulcan-ai-contract = { workspace = true, features = ["test-support"] }
# Exposes exact V1 storage fixtures only while compiling service-kernel tests.
# 仅在编译 service-kernel 测试时暴露精确 V1 存储夹具。
vulcan-workspace-store = { workspace = true, features = ["test-support"] }
# Enables deterministic task-runtime registry seeding only while compiling service-kernel tests.
# 仅在编译 service-kernel 测试时启用确定性的任务运行时注册表播种能力。
vulcan-agent-runtime = { workspace = true, features = ["test-support"] }
# Enables the provider runtime HTTP-client injection seam for signed transport E2E tests.
# 为签名传输 E2E 测试启用供应商运行时 HTTP 客户端注入接缝。
vulcan-provider-adapters = { workspace = true, features = ["test-support"] }
# HTTPS loopback server for the local signing-server E2E (plan §R7.14).
# 供本地签名服务器 E2E 使用的 HTTPS 回环服务器（方案 §R7.14）。
rcgen.workspace = true
tokio-rustls.workspace = true
