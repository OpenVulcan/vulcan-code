[package]
name = "vulcan-code-mode-protocol"
description = "Code-mode session contract and gRPC protocol, vendored from OpenAI Codex."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "MIT AND Apache-2.0"

[lib]
doctest = false

[lints.rust]
unsafe_code = "forbid"

# Vendored from openai/codex: mirror the upstream clippy policy instead of the Vulcan workspace
# lints, whose `missing_docs` requirement the upstream sources do not follow.
[lints.clippy]
dbg_macro = "warn"
todo = "warn"
expect_used = "deny"
unwrap_used = "deny"

[dependencies]
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "sync"] }
tokio-util = { workspace = true, features = ["rt"] }
tonic.workspace = true
tonic-prost.workspace = true
tracing.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true

[build-dependencies]
glob.workspace = true
protoc-bin-vendored.workspace = true
tonic-prost-build.workspace = true
