[package]
name = "vulcan-app-update"
description = "In-app updates of an installed Vulcan Code: checking, incremental assembly, switching, repair and the startup handshake."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
vulcan-install-core = { workspace = true, features = ["http"] }
vulcan-product-info.workspace = true
vulcan-service-api.workspace = true
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
tempfile.workspace = true
vulcan-runtime-assets = { workspace = true, features = ["test-support"] }
