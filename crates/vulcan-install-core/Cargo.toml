[package]
name = "vulcan-install-core"
description = "Signed release formats, file packs and their verification shared by the Vulcan Code installer, updater and release tooling."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

# `http` downloads release objects; the release tool reads local copies and leaves it off.
# `http` 下载发布对象；发布工具读取本地副本，不启用它。
[features]
http = ["dep:ureq"]

[dependencies]
base64.workspace = true
ed25519-dalek.workspace = true
fs4.workspace = true
hex.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
ureq = { workspace = true, optional = true, features = ["rustls", "platform-verifier"] }
zstd.workspace = true

[dev-dependencies]
tempfile.workspace = true
