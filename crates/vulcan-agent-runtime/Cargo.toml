[package]
name = "vulcan-agent-runtime"
description = "Shared agent execution runtime extracted from the desktop workbench."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Exposes deterministic runtime seeding seams only to dependent test targets.
# 仅向依赖方测试目标暴露确定性的运行时播种接缝。
test-support = []

[dependencies]
async-stream.workspace = true
async-trait.workspace = true
base64.workspace = true
encoding_rs.workspace = true
filetime.workspace = true
futures-channel.workspace = true
futures-util.workspace = true
jsonschema.workspace = true
luaskills.workspace = true
png.workspace = true
# Converts declared static image formats locally without a separate AI request.
# 在本地转换已声明的静态图片格式，不发起独立AI请求。
image.workspace = true
# Inspects TIFF page count without silently dropping additional pages.
# 检查TIFF页数，避免静默丢弃后续页面。
tiff.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
hex.workspace = true
sha2.workspace = true
tempfile.workspace = true
time = { workspace = true, features = ["formatting", "local-offset", "macros", "parsing"] }
tokio = { workspace = true, features = ["rt", "sync", "time", "net", "io-util", "fs"] }
uuid.workspace = true
vulcan-context.workspace = true
vulcan-context-engine.workspace = true
vulcan-ai-contract.workspace = true
vulcan-llm-core.workspace = true
vulcan-context-compaction.workspace = true
vulcan-context-injection.workspace = true
vulcan-core.workspace = true
vulcan-change-set.workspace = true
vulcan-session-boundary.workspace = true
vulcan-host-tools.workspace = true
vulcan-hooks.workspace = true
vulcan-luaskills-prompt.workspace = true
vulcan-mcp-runtime.workspace = true
vulcan-permission-judge.workspace = true
vulcan-plugin-runtime.workspace = true
vulcan-prompt-composer.workspace = true
vulcan-prompt-skills.workspace = true
vulcan-provider-config.workspace = true
vulcan-provider-adapters.workspace = true
vulcan-runtime-assets.workspace = true
vulcan-session-core.workspace = true
vulcan-subagent-core.workspace = true
vulcan-task-session.workspace = true
vulcan-tools-luaskills-call.workspace = true
vulcan-tools-manager.workspace = true
vulcan-vmm.workspace = true
vulcan-workbench-model.workspace = true
vulcan-workspace-store.workspace = true
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
vulcan-runtime-assets = { workspace = true, features = ["test-support"] }
# Enables deterministic virtual time so a host-owned deadline test never spends real seconds.
# 启用确定性虚拟时间，使宿主持有期限测试不必消耗真实秒数。
# Explicitly supports the database fixture's scheduler instead of relying on transitive feature unification.
# 显式支持数据库夹具调度器，不依赖传递特性合并。
tokio = { workspace = true, features = ["test-util", "rt-multi-thread"] }
# Enables the explicit staged-source seam for immutable catalog activation tests.
# 为不可变目录激活测试启用显式暂存来源接缝。
vulcan-provider-adapters = { workspace = true, features = ["test-support"] }
# Enables the fixture handle constructor for tests that only need a runtime handle carrying paths.
# 为仅需一个携带路径的运行时句柄的测试启用夹具句柄构造函数。
vulcan-workspace-store = { workspace = true, features = ["test-support"] }
