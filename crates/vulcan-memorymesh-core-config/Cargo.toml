[package]
name = "vulcan-memorymesh-core-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

# Integration tests are declared explicitly as one suite binary (tests/suite.rs).
# 集成测试显式声明为单一套件二进制（tests/suite.rs）。
autotests = false

[dependencies]
hex.workspace = true
include_dir.workspace = true
regex.workspace = true
regex-syntax.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2.workspace = true
toml.workspace = true
vulcan-memorymesh-core-contracts.workspace = true
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[lints]
workspace = true

[[test]]
name = "suite"
path = "tests/suite.rs"
