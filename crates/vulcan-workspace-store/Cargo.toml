[package]
name = "vulcan-workspace-store"
description = "Shared controller-backed workspace persistence, hydration, and history helpers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Exposes exact fixture constructors for downstream crate tests only.
# 仅向下游 crate 测试暴露精确夹具构造函数。
test-support = []
# Enables the explicitly invoked local Debug database maintenance binary.
# 启用需要显式调用的本地 Debug 数据库维护程序。
debug-db-maintenance = []

[[bin]]
name = "vulcan-debug-db"
path = "src/bin/vulcan-debug-db.rs"
required-features = ["debug-db-maintenance"]

[dependencies]
futures-util.workspace = true
serde.workspace = true
base64.workspace = true
serde_json.workspace = true
hex.workspace = true
sha2.workspace = true
pulldown-cmark.workspace = true
rusqlite.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
unicode-normalization.workspace = true
zip.workspace = true
vulcan-sqlite-engine.workspace = true
vulcan-lancedb-engine.workspace = true
vulcan-ai-contract.workspace = true
vulcan-context.workspace = true
vulcan-core.workspace = true
vulcan-runtime-assets.workspace = true
vulcan-session-core.workspace = true
vulcan-workbench-model.workspace = true
vulcan-vmm.workspace = true
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
vulcan-runtime-assets = { workspace = true, features = ["test-support"] }
arrow-ipc.workspace = true
encoding_rs.workspace = true
