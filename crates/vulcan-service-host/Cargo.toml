[package]
name = "vulcan-service-host"
description = "HTTP and WebSocket host for the Vulcan Core Service."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
async-stream = "0.3.6"
axum = { version = "0.8.7", features = ["ws"] }
futures-core = "0.3.31"
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "sync"] }
tower-http = { version = "0.6.7", features = ["cors"] }
uuid.workspace = true
vulcan-ai-contract.workspace = true
vulcan-service-api.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
tower = "0.5.3"
