[package]
name = "vulcan-plugin-runtime"
description = "Manifest-driven bundled Vulcan Plugin host runtime for Vulcan Code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
schemars = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
luaskills.workspace = true
jsonschema.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
semver.workspace = true
hex.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time"] }
uuid.workspace = true
vulcan-hooks.workspace = true
vulcan-prompt-skills.workspace = true
vulcan-runtime-assets.workspace = true
vulcan-task-session.workspace = true
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
tempfile.workspace = true

[features]
manifest-schema = ["dep:schemars", "dep:tempfile", "luaskills/contract-generation", "vulcan-hooks/manifest-schema"]

[[bin]]
name = "vulcan-plugin-manifest"
path = "src/bin/vulcan-plugin-manifest.rs"
required-features = ["manifest-schema"]
