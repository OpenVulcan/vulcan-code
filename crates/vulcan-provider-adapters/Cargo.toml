[package]
name = "vulcan-provider-adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Strongly typed provider connection graphs and request projectors for Vulcan AI."

[features]
# Exposes dependency-injection seams used only by cross-crate transport E2E tests.
# 仅暴露跨 crate 传输 E2E 测试使用的依赖注入接缝。
test-support = []

[dependencies]
vulcan-product-info.workspace = true
async-trait.workspace = true
async-stream.workspace = true
base64.workspace = true
futures-util.workspace = true
reqwest = { workspace = true, features = ["stream", "multipart", "gzip", "brotli", "deflate", "zstd"] }
rustls.workspace = true
httpdate.workspace = true
jsonschema.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
tokio.workspace = true
tokio-util.workspace = true
time = { workspace = true, features = ["parsing"] }
uuid = { workspace = true, features = ["v5"] }
vulcan-ai-contract.workspace = true
vulcan-context.workspace = true
vulcan-llm-core.workspace = true
vulcan-i18n.workspace = true
vulcan-runtime-assets.workspace = true
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
vulcan-runtime-assets = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
tokio-tungstenite.workspace = true

[lints]
workspace = true
