[package]
name = "vulcan-mcp-runtime"
description = "Host-owned Model Context Protocol runtime for VulcanCode."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
futures.workspace = true
http.workspace = true
reqwest = { workspace = true, features = ["charset", "default-tls", "http2", "stream", "system-proxy"] }
rmcp = { workspace = true, features = [
    "client",
    "auth",
    "macros",
    "transport-io",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }
serde.workspace = true
serde_json.workspace = true
sse-stream.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "process", "io-util", "io-std", "time"] }
tokio-util.workspace = true
vulcan-host-tools.workspace = true
vulcan-runtime-assets.workspace = true
vulcan-tools-manager.workspace = true
workspace-hack = { version = "0.1", path = "../../workspace-hack" }
