[package]
name = "vulcan-mcp-runtime"
description = "Host-owned Model Context Protocol runtime for VulcanCode."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
futures = "0.3"
http = "1.3"
reqwest = { version = "0.13", default-features = true, features = ["json", "stream"] }
rmcp = { version = "1.6", default-features = false, features = [
    "client",
    "auth",
    "macros",
    "transport-io",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }
serde.workspace = true
serde_json.workspace = true
sse-stream = "0.2"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "process", "io-util", "io-std", "time"] }
tokio-util = "0.7"
vulcan-host-tools.workspace = true
vulcan-runtime-assets.workspace = true
workspace-hack = { version = "0.1", path = "../../workspace-hack" }
