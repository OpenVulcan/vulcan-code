[package]
name = "vulcan-agent-view"
description = "Structured agent transcript document model and extension-aware Markdown parser."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
serde.workspace = true
iced.workspace = true
vulcan-markdown.workspace = true
dirs.workspace = true
pulldown-cmark = "0.13.3"
ropey = "1.6.1"
time = { version = "0.3.44", features = ["formatting", "local-offset", "macros"] }
unicode-segmentation = "1.12.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
mp4 = "0.14.0"
rust_h264 = "0.4.0"
