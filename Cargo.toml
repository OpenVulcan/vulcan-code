[workspace]
members = [
    "apps/vulcan-code-tauri",
    "crates/vulcan-agent-runtime",
    "crates/vulcan-session-core",
    "crates/vulcan-session-boundary",
    "crates/vulcan-main-session",
    "crates/vulcan-task-session",
    "crates/vulcan-service-api",
    "crates/vulcan-service-host",
    "crates/vulcan-service-kernel",
    "crates/vulcan-service-runtime",
    "crates/vulcan-change-set",
    "crates/vulcan-host-tools",
    "crates/vulcan-windows-console-helper",
    "crates/vulcan-provider-config",
    "crates/vulcan-runtime-assets",
    "crates/vulcan-workbench-model",
    "crates/vulcan-workspace-store",
    "crates/vulcan-context",
    "crates/vulcan-context-injection",
    "crates/vulcan-hooks",
    "crates/vulcan-vmm",
    "crates/vulcan-context-compaction",
    "crates/vulcan-prompt-composer",
    "crates/vulcan-prompt-skills",
    "crates/vulcan-file-watcher",
    "crates/vulcan-mcp-runtime",
    "crates/vulcan-tools-manager",
    "crates/vulcan-core",
    "crates/vulcan-token-counter",
    "crates/vulcan-tools-luaskills-call",
    "crates/vulcan-luaskills-prompt",
]
exclude = [
]
resolver = "2"

[workspace.package]
authors = ["OpenVulcan"]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
vulcan-agent-runtime = { path = "crates/vulcan-agent-runtime" }
vulcan-session-core = { path = "crates/vulcan-session-core" }
vulcan-session-boundary = { path = "crates/vulcan-session-boundary" }
vulcan-main-session = { path = "crates/vulcan-main-session" }
vulcan-task-session = { path = "crates/vulcan-task-session" }
vulcan-mcp-runtime = { path = "crates/vulcan-mcp-runtime" }
vulcan-tools-manager = { path = "crates/vulcan-tools-manager" }
vulcan-core = { path = "crates/vulcan-core" }
vulcan-change-set = { path = "crates/vulcan-change-set" }
vulcan-host-tools = { path = "crates/vulcan-host-tools" }
vulcan-workbench-model = { path = "crates/vulcan-workbench-model" }
vulcan-workspace-store = { path = "crates/vulcan-workspace-store" }
vulcan-runtime-assets = { path = "crates/vulcan-runtime-assets" }
vulcan-service-api = { path = "crates/vulcan-service-api" }
vulcan-service-host = { path = "crates/vulcan-service-host" }
vulcan-service-kernel = { path = "crates/vulcan-service-kernel" }
vulcan-service-runtime = { path = "crates/vulcan-service-runtime" }
vulcan-provider-config = { path = "crates/vulcan-provider-config" }
vulcan-context = { path = "crates/vulcan-context" }
vulcan-context-injection = { path = "crates/vulcan-context-injection" }
vulcan-hooks = { path = "crates/vulcan-hooks" }
vulcan-vmm = { path = "crates/vulcan-vmm" }
vulcan-context-compaction = { path = "crates/vulcan-context-compaction" }
vulcan-prompt-composer = { path = "crates/vulcan-prompt-composer" }
vulcan-prompt-skills = { path = "crates/vulcan-prompt-skills" }
vulcan-file-watcher = { path = "crates/vulcan-file-watcher" }
vulcan-token-counter = { path = "crates/vulcan-token-counter" }
vulcan-tools-luaskills-call = { path = "crates/vulcan-tools-luaskills-call" }
vulcan-luaskills-prompt = { path = "crates/vulcan-luaskills-prompt" }
vldb-controller-client = "0.2.1"
luaskills = "=0.4.6"
async-trait = "0.1.89"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
dirs = "6.0.0"
ignore = "0.4.24"
notify = "8.2.0"
tokio = { version = "1.52.2", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1.43"
tonic = { version = "0.12.3", default-features = false, features = ["transport", "codegen", "prost"] }
tonic-build = "0.12.3"
prost = "0.13.5"
protoc-bin-vendored = "3.2.0"
uuid = { version = "1.18.1", features = ["v4", "serde"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
