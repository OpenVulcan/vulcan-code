[workspace]
members = [
    "apps/vulcan-code-gui",
    "crates/vulcan-change-set",
    "crates/vulcan-host-tools",
    "crates/vulcan-provider-config",
    "crates/vulcan-runtime-assets",
    "crates/vulcan-workbench-model",
    "crates/vulcan-workspace-store",
    "crates/vulcan-context",
    "crates/vulcan-context-compaction",
    "crates/vulcan-prompt-composer",
    "crates/vulcan-file-watcher",
    "crates/vulcan-mcp-runtime",
    "crates/vulcan-agent-view",
    "crates/vulcan-markdown",
    "crates/vulcan-iced-widget",
    "crates/vulcan-tools-manager",
    "crates/vulcan-core",
    "crates/vulcan-token-counter",
]
exclude = [
    "third_party/iced",
    "third_party/iced_aw",
    "third_party/iced_fonts",
]
resolver = "2"

[workspace.package]
authors = ["OpenVulcan"]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
iced = { git = "https://github.com/lingeasy/iced.git", branch = "vulcan-code", default-features = false, features = ["wgpu", "tokio", "svg", "highlighter", "advanced", "lazy", "image", "canvas"] }
iced_aw = { git = "https://github.com/lingeasy/iced_aw.git", branch = "vulcan-code", default-features = false, features = ["context_menu", "date_picker"] }
iced_fonts = { git = "https://github.com/lingeasy/iced_fonts.git", branch = "vulcan-code", default-features = false, features = ["codicon", "fontawesome", "lucide"] }
vulcan-mcp-runtime = { path = "crates/vulcan-mcp-runtime" }
vulcan-agent-view = { path = "crates/vulcan-agent-view" }
vulcan-markdown = { path = "crates/vulcan-markdown" }
vulcan-iced-widget = { path = "crates/vulcan-iced-widget" }
vulcan-tools-manager = { path = "crates/vulcan-tools-manager" }
vulcan-core = { path = "crates/vulcan-core" }
vulcan-change-set = { path = "crates/vulcan-change-set" }
vulcan-host-tools = { path = "crates/vulcan-host-tools" }
vulcan-workbench-model = { path = "crates/vulcan-workbench-model" }
vulcan-workspace-store = { path = "crates/vulcan-workspace-store" }
vulcan-runtime-assets = { path = "crates/vulcan-runtime-assets" }
vulcan-provider-config = { path = "crates/vulcan-provider-config" }
vulcan-context = { path = "crates/vulcan-context" }
vulcan-context-compaction = { path = "crates/vulcan-context-compaction" }
vulcan-prompt-composer = { path = "crates/vulcan-prompt-composer" }
vulcan-file-watcher = { path = "crates/vulcan-file-watcher" }
vulcan-token-counter = { path = "crates/vulcan-token-counter" }
vldb-controller-client = "0.2.1"
luaskills = "=0.4.4"
async-trait = "0.1.89"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
dirs = "6.0.0"
notify = "8.2.0"
tokio = { version = "1.52.2", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1.43"
uuid = { version = "1.18.1", features = ["v4", "serde"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
