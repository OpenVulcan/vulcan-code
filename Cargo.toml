[package]
name = "vulcan-code-tui"
description = "Terminal user interface client for the Vulcan Code core service."
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
authors = ["OpenVulcan"]
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "vulcan-tui"
path = "src/main.rs"

[[bin]]
name = "vulcan-tui-i18n"
path = "src/bin/vulcan-tui-i18n.rs"

[[bin]]
name = "vulcan-tui-assets"
path = "src/bin/vulcan-tui-assets.rs"

[dependencies]
anyhow = "1"
png = "0.18"
ratatui = "0.30"
ratatui-textarea = "0.9"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
unicode-width = "0.2"
