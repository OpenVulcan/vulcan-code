[workspace]
members = [
    "apps/vulcan-code-gui",
    "apps/rig-compose",
    "apps/rig-mcp",
]
resolver = "2"

[workspace.package]
authors = ["OpenVulcan"]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
iced = { version = "0.14.0", default-features = false, features = ["wgpu", "tokio", "svg", "markdown", "highlighter", "advanced"] }
rig = { package = "rig-core", version = "0.36.0", default-features = false, features = ["reqwest", "rustls", "derive"] }
rig-compose = { path = "apps/rig-compose" }
rig-mcp = { path = "apps/rig-mcp" }
vldb-controller-client = "0.2.1"
luaskills = { path = "../../projects/vulcan-luaskills" }
async-trait = "0.1.89"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
dirs = "6.0.0"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
