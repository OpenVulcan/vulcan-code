[workspace]
members = ["apps/vulcan-code-gui"]
resolver = "2"

[workspace.package]
authors = ["OpenVulcan"]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
iced = { version = "0.14.0", default-features = false, features = ["wgpu", "tokio", "svg", "markdown", "highlighter", "advanced"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
