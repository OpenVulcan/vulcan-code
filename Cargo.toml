[workspace]
members = [
    "apps/vulcan-code-gui",
    "crates/vulcan-mcp-runtime",
    "crates/vulcan-agent-view",
    "crates/vulcan-iced-widget",
    "crates/vulcan-tools-manager",
    "crates/vulcan-core",
]
exclude = [
    "third_party/iced",
    "third_party/iced_aw",
    "third_party/iced_fonts",
]
resolver = "2"

[workspace.package]
authors = ["OpenVulcan"]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
iced = { path = "third_party/iced", default-features = false, features = ["wgpu", "tokio", "svg", "markdown", "highlighter", "advanced", "lazy", "image"] }
iced_aw = { path = "third_party/iced_aw", default-features = false, features = ["context_menu"] }
iced_fonts = { path = "third_party/iced_fonts", default-features = false, features = ["codicon", "fontawesome", "lucide"] }
vulcan-mcp-runtime = { path = "crates/vulcan-mcp-runtime" }
vulcan-agent-view = { path = "crates/vulcan-agent-view" }
vulcan-iced-widget = { path = "crates/vulcan-iced-widget" }
vulcan-tools-manager = { path = "crates/vulcan-tools-manager" }
vulcan-core = { path = "crates/vulcan-core" }
vldb-controller-client = "0.2.1"
luaskills = "=0.4.2"
async-trait = "0.1.89"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
dirs = "6.0.0"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
