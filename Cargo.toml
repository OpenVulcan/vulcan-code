[workspace]
members = [
    "apps/vulcan-code-service",
    "crates/vulcan-agent-runtime",
    "crates/vulcan-subagent-core",
    "crates/vulcan-session-core",
    "crates/vulcan-session-boundary",
    "crates/vulcan-task-session",
    "crates/vulcan-service-api",
    "crates/vulcan-service-host",
    "crates/vulcan-service-kernel",
    "crates/vulcan-service-runtime",
    "crates/vulcan-change-set",
    "crates/vulcan-apply-patch",
    "crates/vulcan-host-tools",
    "crates/vulcan-process-lifecycle",
    "crates/vulcan-terminal-host-protocol",
    "crates/vulcan-terminal-host",
    "crates/vulcan-provider-config",
    "crates/vulcan-runtime-assets",
    "crates/vulcan-workbench-model",
    "crates/vulcan-workspace-store",
    "crates/vulcan-context",
    "crates/vulcan-context-engine",
    "crates/vulcan-context-injection",
    "crates/vulcan-hooks",
    "crates/vulcan-vmm",
    "crates/vulcan-context-compaction",
    "crates/vulcan-prompt-composer",
    "crates/vulcan-prompt-skills",
    "crates/vulcan-file-watcher",
    "crates/vulcan-file-ownership",
    "crates/vulcan-mcp-runtime",
    "crates/vulcan-plugin-runtime",
    "crates/vulcan-tools-manager",
    "crates/vulcan-core",
    "crates/vulcan-tools-luaskills-call",
    "crates/vulcan-luaskills-prompt",
    "crates/vulcan-luaskills-config",
    "crates/vulcan-ai-contract",
    "crates/vulcan-memorymesh-core-contracts",
    "crates/vulcan-memorymesh-core-config",
    "crates/vulcan-memorymesh-core-storage",
    "crates/vulcan-memorymesh-core-engine",
    "crates/vulcan-memorymesh-core",
    "crates/vulcan-llm-core",
    "crates/vulcan-provider-adapters",
    "crates/vulcan-hello",
    "crates/vulcan-provider-manifest-cli",
    "crates/vulcan-sqlite-engine",
    "crates/vulcan-lancedb-engine",
    "workspace-hack",
]
exclude = [
    "vendor/lance-bitpacking",
]
resolver = "3"

# Keep the Lance codec unchanged while replacing its unmaintained token-pasting macro dependency.
# 保持 Lance 编解码器不变，仅替换其停止维护的标识符拼接宏依赖。
[patch.crates-io]
lance-bitpacking = { path = "vendor/lance-bitpacking" }

[workspace.package]
authors = ["OpenVulcan"]
edition = "2024"
license = "MIT"
rust-version = "1.97.1"
version = "0.1.0"

[workspace.dependencies]
vulcan-agent-runtime = { path = "crates/vulcan-agent-runtime" }
vulcan-subagent-core = { path = "crates/vulcan-subagent-core" }
vulcan-session-core = { path = "crates/vulcan-session-core" }
vulcan-session-boundary = { path = "crates/vulcan-session-boundary" }
vulcan-task-session = { path = "crates/vulcan-task-session" }
vulcan-mcp-runtime = { path = "crates/vulcan-mcp-runtime" }
vulcan-plugin-runtime = { path = "crates/vulcan-plugin-runtime" }
vulcan-tools-manager = { path = "crates/vulcan-tools-manager" }
vulcan-core = { path = "crates/vulcan-core" }
vulcan-change-set = { path = "crates/vulcan-change-set" }
vulcan-apply-patch = { path = "crates/vulcan-apply-patch" }
vulcan-host-tools = { path = "crates/vulcan-host-tools" }
vulcan-process-lifecycle = { path = "crates/vulcan-process-lifecycle" }
vulcan-terminal-host-protocol = { path = "crates/vulcan-terminal-host-protocol" }
vulcan-workbench-model = { path = "crates/vulcan-workbench-model" }
vulcan-workspace-store = { path = "crates/vulcan-workspace-store" }
vulcan-runtime-assets = { path = "crates/vulcan-runtime-assets" }
vulcan-service-api = { path = "crates/vulcan-service-api" }
vulcan-service-host = { path = "crates/vulcan-service-host" }
vulcan-service-kernel = { path = "crates/vulcan-service-kernel" }
vulcan-service-runtime = { path = "crates/vulcan-service-runtime" }
vulcan-provider-config = { path = "crates/vulcan-provider-config" }
vulcan-provider-manifest-cli = { path = "crates/vulcan-provider-manifest-cli" }
vulcan-context = { path = "crates/vulcan-context" }
vulcan-context-engine = { path = "crates/vulcan-context-engine" }
vulcan-context-injection = { path = "crates/vulcan-context-injection" }
vulcan-hooks = { path = "crates/vulcan-hooks" }
vulcan-vmm = { path = "crates/vulcan-vmm" }
vulcan-context-compaction = { path = "crates/vulcan-context-compaction" }
vulcan-prompt-composer = { path = "crates/vulcan-prompt-composer" }
vulcan-prompt-skills = { path = "crates/vulcan-prompt-skills" }
vulcan-file-watcher = { path = "crates/vulcan-file-watcher" }
vulcan-file-ownership = { path = "crates/vulcan-file-ownership" }
vulcan-tools-luaskills-call = { path = "crates/vulcan-tools-luaskills-call" }
vulcan-luaskills-prompt = { path = "crates/vulcan-luaskills-prompt" }
vulcan-luaskills-config = { path = "crates/vulcan-luaskills-config" }
vulcan-ai-contract = { path = "crates/vulcan-ai-contract" }
vulcan-memorymesh-core-contracts = { path = "crates/vulcan-memorymesh-core-contracts" }
vulcan-memorymesh-core-config = { path = "crates/vulcan-memorymesh-core-config" }
vulcan-memorymesh-core-storage = { path = "crates/vulcan-memorymesh-core-storage" }
vulcan-memorymesh-core-engine = { path = "crates/vulcan-memorymesh-core-engine" }
vulcan-memorymesh-core = { path = "crates/vulcan-memorymesh-core" }
vulcan-llm-core = { path = "crates/vulcan-llm-core" }
vulcan-provider-adapters = { path = "crates/vulcan-provider-adapters" }
# In-process database engines migrated from vldb-sqlite and vldb-lancedb.
# 从 vldb-sqlite 与 vldb-lancedb 迁入的进程内数据库引擎。
vulcan-sqlite-engine = { path = "crates/vulcan-sqlite-engine" }
vulcan-lancedb-engine = { path = "crates/vulcan-lancedb-engine" }
# Unified database dependency generation. These are declared once here; the two engine crates
# inherit them and must not pin an alternative version locally.
# 统一数据库依赖代际：只在此声明一次，两个引擎 crate 继承声明，不得自行固定其他版本。
arrow = { version = "58.1.0", features = ["ipc"] }
arrow-array = "58.1.0"
arrow-ipc = "58.1.0"
arrow-schema = "58.1.0"
fs4 = "1.1.0"
jieba-rs = "0.10.3"
lancedb = { version = "0.38.0", features = ["remote"] }
rusqlite = { version = "0.40.2", features = ["bundled", "column_decltype", "pointer"] }
async-stream = "0.3.6"
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.23.1"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
chardetng = "1.0.0"
chrono = { version = "0.4.42", default-features = false, features = ["std"] }
chrono-tz = "=0.10.4"
iana-time-zone = "=0.1.65"
dirs = "6.0.0"
ed25519-dalek = "3"
encoding_rs = "0.8.35"
filetime = "0.2.29"
flate2 = "1.1.9"
fs2 = "0.4"
futures = "0.3"
futures-channel = "0.3.34"
futures-core = "0.3.34"
futures-util = "0.3.34"
hex = "0.4.3"
http = "1.5"
http-range = "0.1.5"
httpdate = "1.0.3"
ignore = "0.4.33"
include_dir = "0.7.4"
jsonschema = { version = "=0.49.9", default-features = false }
keyring = { version = "4.1.6", default-features = false, features = ["v1"] }
libc = "0.2"
luaskills = "=0.5.9"
notify = "8.2.0"
notify-rust = "=4.18.0"
png = "0.18.1"
portable-pty = "0.9.0"
prost = "0.14.4"
prost-build = "0.14.4"
protoc-bin-vendored = "3.2.0"
pulldown-cmark = "0.13.4"
rcgen = "0.14"
reqwest = { version = "0.13.4", default-features = false, features = ["form", "json", "rustls"] }
regex = "1.13.1"
regex-syntax = "0.8.8"
rmcp = { version = "3.1", default-features = false }
rustls = { version = "0.23.45", default-features = false, features = ["ring"] }
rustix = { version = "1.1.4", features = ["process"] }
semver = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
sse-stream = "0.2"
sys-locale = "0.3.2"
tar = "0.4.46"
tao = { version = "0.35.3", default-features = false }
tray-icon = { version = "0.24.2", default-features = false, features = ["gtk"] }
winresource = { version = "0.1.31", default-features = false }
tempfile = "3.27.0"
time = "0.3.55"
thiserror = "2.0.16"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = "0.26"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
tokio-util = { version = "0.7.19", features = ["io"] }
toml = "1.1"
tonic = { version = "0.14.6", default-features = false, features = ["transport", "codegen"] }
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tower = "0.5.3"
tower-http = "0.7.0"
tracing = "0.1.44"
uuid = { version = "1.24.1", features = ["v4", "serde"] }
vt100 = "0.16.2"
windows-sys = "0.61.2"
windows = "=0.62.2"
xz2 = { version = "0.1.7", features = ["static"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

# Keep the kernel archive readable by MSVC while preserving source locations in debug builds.
# 在调试构建中保留源码位置，同时避免内核归档体积增长到 MSVC 无法读取的符号表格式。
[profile.dev.package.vulcan-service-kernel]
debug = "limited"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
