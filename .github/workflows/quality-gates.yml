# Permanent checks apply to the main branch and every proposed merge.
# 永久检查适用于主分支与所有拟合入变更。
name: Quality gates
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Weekly full coverage catches classification drift without repeating it on every UI edit.
  # 每周完整检查捕获分类规则漂移，避免每次界面编辑都重复执行。
  schedule:
    - cron: '23 19 * * 0'
permissions:
  contents: read
# Concurrency belongs to each domain so an unrelated UI push cannot cancel Rust cache creation.
# 并发控制归各检查域所有，避免无关界面推送取消 Rust 缓存建立。
jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scripts: ${{ steps.scope.outputs.scripts }}
      frontend: ${{ steps.scope.outputs.frontend }}
      desktop: ${{ steps.scope.outputs.desktop }}
      rustfmt: ${{ steps.scope.outputs.rustfmt }}
      rust: ${{ steps.scope.outputs.rust }}
      fixtures: ${{ steps.scope.outputs.fixtures }}
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - id: versions
        run: node scripts/ci-runtime-versions.mjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ steps.versions.outputs.node }}
      - name: Verify classification and required-result failure paths
        run: node --test scripts/ci-scope.test.mjs scripts/ci-rust-cache.test.mjs
      - id: scope
        run: node scripts/ci-scope.mjs --from-event
  scripts:
    name: Build contracts (${{ matrix.os }})
    concurrency:
      group: quality-scripts-${{ matrix.os }}-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: versions
        run: node scripts/ci-runtime-versions.mjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ steps.versions.outputs.node }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: target/build-input-cache
          key: build-inputs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-inputs.lock.json') }}
      - name: Download and verify locked CLI tools
        run: node scripts/install-locked-tools.mjs bundled
      - name: Download and verify locked protoc
        run: node scripts/install-locked-tools.mjs protoc
      - name: Reinstall CLI tools from verified cache without network
        run: node scripts/install-locked-tools.mjs bundled --offline
      - name: Reinstall protoc from verified cache without network
        run: node scripts/install-locked-tools.mjs protoc --offline
      - name: Verify the Windows CI runner online and offline
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node scripts/install-locked-tools.mjs nextest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/install-locked-tools.mjs nextest --offline
      - name: Validate download, publication and layout failure paths
        run: node --test scripts/ci-scope.test.mjs scripts/locked-download.test.mjs scripts/install-locked-tools.test.mjs scripts/directory-publication.test.mjs scripts/desktop-runtime.test.mjs scripts/managed-node.test.mjs scripts/browser-runtime.test.mjs
  frontend:
    name: Frontend gates
    concurrency:
      group: quality-frontend-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: versions
        run: node scripts/ci-runtime-versions.mjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ steps.versions.outputs.node }}
      - name: Install declared pnpm
        run: npm install --global pnpm@${{ steps.versions.outputs.pnpm }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ steps.versions.outputs.node }}
          cache: pnpm
          cache-dependency-path: apps/vulcan-code-web/pnpm-lock.yaml
      - name: Install frozen frontend dependencies
        run: pnpm --dir apps/vulcan-code-web install --frozen-lockfile
      - name: Prove invalid lint and architecture fixtures are rejected
        if: needs.changes.outputs.fixtures == 'true'
        run: |
          pnpm --dir apps/vulcan-code-web run test:lint
          pnpm --dir apps/vulcan-code-web run test:architecture
      - name: Frontend behavior regressions
        run: pnpm --dir apps/vulcan-code-web exec vitest run --maxWorkers=4
      - name: Bundled plugin UI and locale regressions
        run: node --test plugins/context7/ui/index.test.mjs plugins/vulcan-browser/ui/settings.test.mjs plugins/vulcan-rtk/ui/index.test.mjs plugins/vulcan-usage-statistics/ui/index.test.mjs
      - name: Lint, typecheck, architecture, production build and size budgets
        run: pnpm --dir apps/vulcan-code-web run build
  desktop:
    name: Desktop gates
    concurrency:
      group: quality-desktop-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: versions
        run: node scripts/ci-runtime-versions.mjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ steps.versions.outputs.node }}
      - name: Install declared pnpm
        run: npm install --global pnpm@${{ steps.versions.outputs.pnpm }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ steps.versions.outputs.node }}
          cache: pnpm
          cache-dependency-path: apps/vulcan-code-desktop/pnpm-lock.yaml
      - name: Install frozen desktop dependencies
        run: pnpm --dir apps/vulcan-code-desktop install --frozen-lockfile
      - name: Compile desktop and its test targets
        run: pnpm --dir apps/vulcan-code-desktop run build
      - name: Desktop unit regressions
        run: pnpm --dir apps/vulcan-code-desktop run test:unit
  rustfmt:
    name: Rust formatting
    concurrency:
      group: quality-rustfmt-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    needs: changes
    if: needs.changes.outputs.rustfmt == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: cargo fmt --all -- --check
  rust:
    name: Rust gates
    # Main warms the shared cache to completion; superseded PR runs may still be cancelled.
    # 主分支保留共享缓存建立过程直至完成；过时的 PR 运行仍可取消。
    concurrency:
      group: quality-rust-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    needs: [changes, rustfmt]
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      # Cargo test inherits dev; omit bulky dependency debug symbols without disabling runtime assertions.
      # Cargo test 继承 dev；省去庞大的依赖调试符号，不关闭运行时断言。
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_TARGET_DIR: target/ci-rust
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: versions
        run: node scripts/ci-runtime-versions.mjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ steps.versions.outputs.node }}
      - name: Install declared pnpm
        run: npm install --global pnpm@${{ steps.versions.outputs.pnpm }}
      - name: Identify the pinned compiler and isolated cache paths
        id: rust-identity
        run: node scripts/ci-rust-cache.mjs
      # Complete artifacts win; a database checkpoint or older dependency graph can still seed Cargo's own validation.
      # 优先完整产物；数据库检查点或旧依赖图仍可供 Cargo 自身验证并复用。
      - name: Restore compiled Rust artifacts
        id: rust-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        env:
          RUST_CACHE_PREFIX: rust-artifacts-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-identity.outputs.compiler }}
          RUST_CACHE_INPUTS: ${{ hashFiles('**/Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', 'scripts/build-inputs.lock.json', '.github/workflows/quality-gates.yml', 'scripts/ci-rust-cache.mjs', 'scripts/test-isolated-callbacks.mjs') }}
        with:
          path: ${{ steps.rust-identity.outputs.paths }}
          key: ${{ env.RUST_CACHE_PREFIX }}-${{ env.RUST_CACHE_INPUTS }}-complete
          restore-keys: |
            ${{ env.RUST_CACHE_PREFIX }}-${{ env.RUST_CACHE_INPUTS }}-
            ${{ env.RUST_CACHE_PREFIX }}-
      - name: Report Rust cache reuse
        shell: pwsh
        env:
          CACHE_EXACT: ${{ steps.rust-cache.outputs.cache-hit }}
          CACHE_MATCHED: ${{ steps.rust-cache.outputs.cache-matched-key }}
          CACHE_REQUESTED: ${{ steps.rust-cache.outputs.cache-primary-key }}
        run: |
          "Rust cache exact hit: $env:CACHE_EXACT" >> $env:GITHUB_STEP_SUMMARY
          "Restored: $env:CACHE_MATCHED" >> $env:GITHUB_STEP_SUMMARY
          "Requested: $env:CACHE_REQUESTED" >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: target/build-input-cache
          key: rust-build-inputs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-inputs.lock.json') }}
      - name: Prepare only the dependencies consumed by Rust CI
        shell: pwsh
        run: |
          node scripts/install-locked-tools.mjs protoc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/install-locked-tools.mjs nextest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$PWD/target/ci-tools/bin" >> $env:GITHUB_PATH
          node scripts/install-locked-tools.mjs bundled
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./make.ps1 deps lua
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/managed-node.mjs output
      # This is the actual first regression target, not a second artificial LanceDB build with different features.
      # 预编译真实的首个回归目标，不以不同特性额外构建一份人工 LanceDB 目标。
      - name: Compile database tests and heavy dependencies
        if: steps.rust-cache.outputs.cache-hit != 'true'
        run: cargo test --locked -p vulcan-workspace-store --lib --no-run
      # Save before later compilation/tests so cancellation or a downstream failure does not erase this expensive stage.
      # 在后续编译、测试前保存，避免取消或下游失败丢失这一昂贵阶段。
      - name: Save database dependency checkpoint
        if: github.ref == 'refs/heads/main' && steps.rust-cache.outputs.cache-hit != 'true' && steps.rust-cache.outputs.cache-matched-key != format('{0}-database', steps.rust-cache.outputs.cache-primary-key)
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ steps.rust-identity.outputs.paths }}
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}-database
      - name: Compile workspace including test targets
        run: cargo check --locked --workspace --all-targets
      # Complexity counts guide refactoring; compiler errors remain mandatory in the preceding step.
      # 复杂度计数用于指导重构；上一环节的编译错误仍然强制阻断。
      - name: Full-run kernel complexity diagnostics
        if: needs.changes.outputs.full == 'true'
        run: cargo clippy --locked --no-deps -p vulcan-service-kernel --all-targets -- -W clippy::too_many_arguments -W clippy::type_complexity
      # Compile the same package/feature graphs used below before caching; test failures must not discard successful builds.
      # 缓存前编译下方使用的相同包与特性图，测试失败不能丢弃已成功的编译。
      - name: Compile remaining Rust regression targets
        if: steps.rust-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          foreach ($crate in @('vulcan-agent-runtime', 'vulcan-service-kernel', 'vulcan-code-service', 'vulcan-llm-core')) {
            cargo test --locked -p $crate --no-run
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          cargo build --locked -p vulcan-plugin-runtime --features manifest-schema --bin vulcan-plugin-manifest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p vulcan-plugin-runtime --features manifest-schema --no-run
      # Distinct immutable keys let the compiled archive grow beyond the database checkpoint; every test still runs below.
      # 不同不可变键允许编译归档补全数据库检查点；下方仍执行全部测试。
      - name: Save complete Rust build cache
        if: github.ref == 'refs/heads/main' && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ steps.rust-identity.outputs.paths }}
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Database boundary regression tests
        run: cargo test --locked -p vulcan-workspace-store --lib local_sql -- --test-threads=1
      - name: Isolated offline LuaSkills callback regressions
        run: node scripts/test-isolated-callbacks.mjs
      # Check the full Rust-derived manifest contract and explicit authoring boundaries.
      # 检查由 Rust 派生的完整清单契约及显式编写边界。
      - name: Plugin manifest artifacts and migration
        shell: pwsh
        run: |
          cargo run --locked -p vulcan-plugin-runtime --features manifest-schema --bin vulcan-plugin-manifest -- schema-check docs/contracts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p vulcan-plugin-runtime --features manifest-schema -- manifest_authoring --test-threads=1
      # Exercise the real synced browser package and managed debug sidecar through formal Lua ownership.
      # 通过正式 Lua 所有权执行真实已同步浏览器插件及受管调试进程。
      - name: Bundled plugin version-two runtime migration
        shell: pwsh
        run: |
          ./make.ps1 sync
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p vulcan-plugin-runtime --features manifest-schema runtime::tests::bundled -- --test-threads=1 --include-ignored
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test plugins/vulcan-debug-runtime/node/sidecar.test.mjs
      - name: Service log retention and hidden-process diagnostics
        run: cargo test --locked -p vulcan-code-service logging::tests -- --test-threads=1
      - name: Protocol core regressions
        run: cargo test --locked -p vulcan-llm-core --lib
      - name: Real host database channel regressions
        run: cargo test --locked -p vulcan-agent-runtime luaskills_runtime::database_callbacks::tests -- --test-threads=1
  required:
    name: Required quality gates
    if: always()
    needs: [changes, scripts, frontend, desktop, rustfmt, rust]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Require success for selected jobs and intentional skips for all others
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-scope.mjs --verify-required
