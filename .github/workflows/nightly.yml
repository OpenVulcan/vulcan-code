# Full suites that are too slow for every pull request: all nextest tests, isolated callbacks and doctests on
# Windows and Linux, the plugin manifest contract, and the quarantined tests on their own. Nothing here blocks
# merging; a failure opens or updates one tracking issue with the run link. The schedule runs only when main
# has a commit the last successful run did not test.
# 对每个合并请求而言过慢的完整测试集：Windows 与 Linux 上的全部 nextest、隔离回调与文档测试，插件清单契约，
# 以及单独运行的被隔离测试。这里的结果不阻塞合并；失败时创建或更新一个带运行链接的跟踪 issue。
# 定时运行只在 main 有最近一次成功运行未测试过的提交时执行。
name: Nightly
on:
  schedule:
    # 03:17 Taiwan time, outside the working day.
    # 台湾时间 03:17，避开工作时段。
    - cron: '17 19 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nightly
  cancel-in-progress: false
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_BUILD_JOBS: '4'
  CARGO_TERM_COLOR: always
jobs:
  # Manual runs always proceed; a scheduled run skips a main commit the last successful run already tested.
  # 手动运行总是执行；定时运行跳过最近一次成功运行已测试过的 main 提交。
  pending:
    name: Check for an untested commit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.compare.outputs.run }}
    steps:
      - id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          passed=''
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/nightly.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""')
          fi
          if [ "$passed" = "$GITHUB_SHA" ]; then run=false; else run=true; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Last passed: ${passed:-none}; this commit: $GITHUB_SHA; run: $run"
  rust-full:
    name: Full Rust suite (${{ matrix.os }})
    needs: pending
    if: needs.pending.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # The CI fast tests compile the same graph, so both reuse one dependency cache per platform.
      # CI 快速测试编译相同的依赖图，因此两者在每个平台上共用一份依赖缓存。
      - uses: ./.github/actions/rust-setup
        with:
          shared-key: tests
      - name: Test runner, bundled tools, Lua payload, managed Node and synced resources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          node scripts/install-locked-tools.mjs nextest
          echo "$PWD/target/ci-tools/bin" >> "$GITHUB_PATH"
          node scripts/install-locked-tools.mjs bundled
          if [ "$RUNNER_OS" = Windows ]; then make_entry='pwsh ./make.ps1'; else make_entry='sh ./make.sh'; fi
          $make_entry deps lua
          node scripts/managed-node.mjs output
          $make_entry sync
      - name: Full nextest set, isolated callbacks and doctests
        run: node scripts/test-rust.mjs full
      # Quarantined tests report results without failing the run; their outcomes decide when they leave the list.
      # 被隔离的测试只报告结果，不使本次运行失败；其结果决定何时移出清单。
      - name: Quarantined tests
        continue-on-error: true
        run: node scripts/test-rust.mjs quarantine
      - name: Plugin manifest contract and bundled plugin runtime
        if: runner.os == 'Linux'
        run: |
          set -eu
          cargo run --locked -p vulcan-plugin-runtime --features manifest-schema --bin vulcan-plugin-manifest -- schema-check docs/contracts
          cargo test --locked -p vulcan-plugin-runtime --features manifest-schema -- manifest_authoring --test-threads=1
          cargo test --locked -p vulcan-plugin-runtime --features manifest-schema runtime::tests::bundled -- --test-threads=1 --include-ignored
          node --test plugins/vulcan-debug-runtime/node/sidecar.test.mjs
  report:
    name: Report failure
    needs: rust-full
    if: failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      # One open issue tracks nightly failures; later failures add a comment instead of a new issue.
      # 一个未关闭的 issue 跟踪夜间失败；后续失败追加评论而不新建 issue。
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          title='Nightly CI failure'
          body="Nightly run failed on $(date -u +%Y-%m-%d): $RUN_URL"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
