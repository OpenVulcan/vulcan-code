# Cross-platform check before a release: the release workflow calls it before building, and it can be started by
# hand. Pushes and merges trigger nothing; local checks (`make check`, targeted tests) cover the day-to-day work.
# Every run checks everything, and the run fails when any job fails.
# 发布前的跨平台检查：发布工作流在构建前调用它，也可以手动启动。推送与合并不触发任何运行；日常工作由本地检查
# （`make check`、定向测试）负责。每次运行检查全部内容，任一作业失败即整次运行失败。
name: CI
on:
  workflow_call:
    inputs:
      runners:
        description: auto, hosted or self-hosted
        type: string
        default: auto
    secrets:
      RUNNER_STATUS_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      runners:
        description: Self-hosted pools (auto uses the online ones; see docs/contracts/self-hosted-runners.md)
        type: choice
        options: [auto, hosted, self-hosted]
        default: auto
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
  # Tests inherit dev; dropping workspace debug info shrinks the target directory without disabling assertions.
  # 测试继承 dev；去掉工作区调试信息可缩小目标目录，不关闭断言。
  CARGO_PROFILE_DEV_DEBUG: '0'
  # Hosted runners have 4 vCPUs and 16 GB; the repository's 16 jobs are sized for a 32-thread workstation.
  # 托管运行器只有 4 个 vCPU 与 16 GB；仓库的 16 并发按 32 线程工作站设定。
  CARGO_BUILD_JOBS: '4'
  CARGO_TERM_COLOR: always
jobs:
  runners:
    name: Runners
    uses: ./.github/workflows/runners.yml
    with:
      runners: ${{ inputs.runners || 'auto' }}
    secrets:
      RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
  scripts:
    name: Build scripts (${{ matrix.os }})
    needs: runners
    strategy:
      fail-fast: false
      matrix:
        # `pool` names the self-hosted pool that may take the job instead of the hosted image (runners.yml).
        # `pool` 指明可以代替托管镜像运行该作业的自托管池（runners.yml）。
        include:
          - { os: ubuntu-24.04 }
          - { os: windows-2025 }
          - { os: macos-15, pool: macos }
    runs-on: ${{ fromJSON(needs.runners.outputs.pools)[matrix.pool || 'none'] || matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          clean: ${{ runner.environment != 'self-hosted' }}
      - uses: ./.github/actions/self-hosted-workspace
        with:
          step: prepare
      - id: versions
        run: node scripts/ci-runtime-versions.mjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ steps.versions.outputs.node }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: third_party/build-input-cache
          key: build-inputs-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-inputs.lock.json') }}
      - name: Download and verify locked tools, then reinstall them without network
        run: |
          set -eu
          tools='bundled protoc'
          if [ "$RUNNER_OS" != macOS ]; then tools="$tools nextest"; fi
          for group in $tools; do node scripts/install-locked-tools.mjs "$group"; done
          for group in $tools; do node scripts/install-locked-tools.mjs "$group" --offline; done
      - name: Build script tests
        run: node --test scripts/*.test.mjs scripts/*.test.cjs
      - uses: ./.github/actions/self-hosted-workspace
        if: ${{ !cancelled() }}
        with:
          step: tidy
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: versions
        run: node scripts/ci-runtime-versions.mjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ steps.versions.outputs.node }}
      - name: Install declared pnpm
        run: npm install --global pnpm@${{ steps.versions.outputs.pnpm }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ steps.versions.outputs.node }}
          cache: pnpm
          cache-dependency-path: apps/vulcan-code-web/pnpm-lock.yaml
      - name: Install frozen frontend dependencies
        run: pnpm --dir apps/vulcan-code-web install --frozen-lockfile
      - name: Prove invalid lint and architecture fixtures are rejected
        run: |
          pnpm --dir apps/vulcan-code-web run test:lint
          pnpm --dir apps/vulcan-code-web run test:architecture
      - name: Frontend behavior regressions
        run: pnpm --dir apps/vulcan-code-web exec vitest run --maxWorkers=4
      - name: Bundled plugin UI and locale regressions
        run: node --test plugins/context7/ui/settings.test.mjs plugins/vulcan-usage-statistics/ui/index.test.mjs
      - name: Lint, typecheck, architecture, production build and size budgets
        run: pnpm --dir apps/vulcan-code-web run build
  desktop:
    name: Desktop
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: versions
        run: node scripts/ci-runtime-versions.mjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ steps.versions.outputs.node }}
      - name: Install declared pnpm
        run: npm install --global pnpm@${{ steps.versions.outputs.pnpm }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ steps.versions.outputs.node }}
          cache: pnpm
          cache-dependency-path: apps/vulcan-code-desktop/pnpm-lock.yaml
      - name: Install frozen desktop dependencies
        run: pnpm --dir apps/vulcan-code-desktop install --frozen-lockfile
      - name: Compile desktop and its test targets
        run: pnpm --dir apps/vulcan-code-desktop run build
      - name: Desktop unit regressions
        run: pnpm --dir apps/vulcan-code-desktop run test:unit
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: versions
        run: node scripts/ci-runtime-versions.mjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ steps.versions.outputs.node }}
      - name: Pinned Rust toolchain
        run: rustup toolchain install
      - name: Rust formatting and repository ratchets
        run: node scripts/check.mjs rustfmt repository
  rust-check:
    name: Rust clippy
    needs: runners
    runs-on: ${{ fromJSON(needs.runners.outputs.pools)['linux-x64'] || 'ubuntu-24.04' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          clean: ${{ runner.environment != 'self-hosted' }}
      - uses: ./.github/actions/self-hosted-workspace
        with:
          step: prepare
      - uses: ./.github/actions/rust-setup
      - name: Clippy on every target with warnings denied
        run: node scripts/check.mjs clippy
      - uses: ./.github/actions/self-hosted-workspace
        if: ${{ !cancelled() }}
        with:
          step: tidy
  rust-tests:
    name: Rust fast tests
    needs: runners
    runs-on: ${{ fromJSON(needs.runners.outputs.pools)['linux-x64'] || 'ubuntu-24.04' }}
    # A cold cache compiles two dependency graphs (the isolated LanceDB library and the workspace tests),
    # at least half an hour each on this runner. A timeout leaves compilers writing `target/`, so the cache is not
    # saved and every later run stays cold; the limit therefore covers a complete cold run.
    # 冷缓存需要编译两套依赖图（隔离的 LanceDB 库与工作区测试），在此运行器上各需半小时以上。超时会让编译器仍在
    # 写入 `target/`，缓存因此无法保存，之后每轮都是冷编译；所以上限必须覆盖一次完整的冷运行。
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          clean: ${{ runner.environment != 'self-hosted' }}
      - uses: ./.github/actions/self-hosted-workspace
        with:
          step: prepare
      - uses: ./.github/actions/rust-setup
        with:
          shared-key: tests
      # The read-only job token lifts the LuaSkills release lookup off the anonymous per-address limit.
      # 只读作业令牌让 LuaSkills 发布查询不受按地址的匿名配额限制。
      - name: Test runner, bundled tools, Lua payload and managed Node
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          node scripts/install-locked-tools.mjs nextest
          echo "$PWD/target/ci-tools/bin" >> "$GITHUB_PATH"
          node scripts/install-locked-tools.mjs bundled
          sh ./make.sh deps lua
          node scripts/managed-node.mjs output
      - name: Fast nextest set without quarantined tests
        run: node scripts/test-rust.mjs fast
      - uses: ./.github/actions/self-hosted-workspace
        if: ${{ !cancelled() }}
        with:
          step: tidy
  # Rust tests run on Linux; Windows and macOS compile the service and the setup program so platform-specific code is checked there too.
  # Rust 测试在 Linux 上运行；Windows 与 macOS 编译服务与安装器，使平台专属代码在这两个系统上也得到检查。
  platform-check:
    name: Service and setup check (${{ matrix.os }})
    needs: runners
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, pool: windows-x64 }
          - { os: macos-15, pool: macos }
    runs-on: ${{ fromJSON(needs.runners.outputs.pools)[matrix.pool || 'none'] || matrix.os }}
    timeout-minutes: 60
    env:
      # Hosted images have 4 vCPUs; an own machine uses the repository's default of 16.
      # 托管镜像只有 4 个 vCPU；自有机器使用仓库默认的 16。
      CARGO_BUILD_JOBS: ${{ fromJSON(needs.runners.outputs.pools)[matrix.pool || 'none'] && '16' || '4' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          clean: ${{ runner.environment != 'self-hosted' }}
      - uses: ./.github/actions/self-hosted-workspace
        with:
          step: prepare
      - uses: ./.github/actions/rust-setup
      - name: Check the service
        run: cargo check --locked -p vulcan-code-service
      - name: Check the setup program and its tests
        run: cargo check --locked -p vulcan-code-setup --all-targets
      - uses: ./.github/actions/self-hosted-workspace
        if: ${{ !cancelled() }}
        with:
          step: tidy
