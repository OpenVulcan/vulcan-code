schema_version: 1
id: vulcan-usage-statistics
version: 0.1.0
default_enabled: true
display:
  name: Vulcan Usage Statistics
  capability: Provider API usage, latency, reliability, and token statistics
permissions:
  - config
  - storage_sqlite
  - ui_host_context
required_files:
  - LICENSE
  - config/schema.json
  - config/defaults.json
  - schemas/hooks/provider-request-started.json
  - schemas/hooks/provider-response-first-token.json
  - schemas/hooks/provider-request-completed.json
  - schemas/hooks/provider-request-retrying.json
  - ui/index.mjs
  - locales/en.yaml
  - locales/zh-CN.yaml
execution:
  dependencies:
    manifest: dependencies.yaml
    install_mode: bundled
lua_runtime:
  bundle: runtime/plugin.bundle.lua
  invoke_function: dispatch
  shutdown_function: shutdown
  hook_shutdown_function: shutdown_hooks
  max_active_sessions: 8
  session_idle_timeout_sec: 300
  lifecycle:
    install: on_install
    enable: on_enable
    disable: on_disable
    uninstall: on_uninstall
  actions:
    - id: settings-get
      function: settings_get
      output_schema_file: schemas/settings-output.json
      timeout_ms: 5000
      callers:
        - plugin_ui
    - id: settings-update
      function: settings_update
      input_schema_file: config/schema.json
      output_schema_file: schemas/settings-output.json
      timeout_ms: 5000
      callers:
        - plugin_ui
    - id: dashboard-get
      function: dashboard_get
      input_schema_file: schemas/dashboard-input.json
      output_schema_file: schemas/dashboard-output.json
      timeout_ms: 12000
      callers:
        - plugin_ui
    - id: revision-get
      function: revision_get
      output_schema_file: schemas/revision-output.json
      timeout_ms: 3000
      callers:
        - plugin_ui
    - id: recent-get
      function: recent_get
      input_schema_file: schemas/recent-input.json
      output_schema_file: schemas/recent-output.json
      timeout_ms: 8000
      callers:
        - plugin_ui
    - id: errors-get
      function: errors_get
      input_schema_file: schemas/dashboard-input.json
      output_schema_file: schemas/errors-output.json
      timeout_ms: 8000
      callers:
        - plugin_ui
  hooks:
    - id: provider-request-started
      point: provider.request.started
      mode: effect
      scope: session
      function: provider_request_started
      priority: 100
      timeout_ms: 3000
      failure_policy: continue
      display_name: Provider request started statistics
      progress_label: Tracking Provider request
    - id: provider-response-first-token
      point: provider.response.first_token
      mode: effect
      scope: session
      function: provider_response_first_token
      priority: 100
      timeout_ms: 3000
      failure_policy: continue
      display_name: Provider first token statistics
      progress_label: Tracking Provider first token
    - id: provider-request-completed
      point: provider.request.completed
      mode: effect
      scope: session
      function: provider_request_completed
      priority: 100
      timeout_ms: 12000
      failure_policy: continue
      display_name: Provider request completed statistics
      progress_label: Saving Provider request statistics
    - id: provider-request-retrying
      point: provider.request.retrying
      mode: effect
      scope: session
      function: provider_request_retrying
      priority: 100
      timeout_ms: 3000
      failure_policy: continue
      display_name: Provider retry statistics
      progress_label: Tracking Provider retry
config:
  schema_file: config/schema.json
  defaults_file: config/defaults.json
ui:
  mounts:
    - id: usage-statistics
      point: skills_plugin_detail
      label: Usage Statistics
      label_message_key: navigationLabel
      icon: chart
      entry: ui/index.mjs
      export: createPluginPanel
locales:
  en: locales/en.yaml
  zh-CN: locales/zh-CN.yaml
