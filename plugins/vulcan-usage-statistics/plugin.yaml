schema_version: 2
id: vulcan-usage-statistics
version: 0.5.1
default_enabled: true
display:
  name: Vulcan Usage Statistics
  capability: Maintain Provider Token facts and compute plugin-owned reference estimates
permissions:
  - system_vldb_access
  - config
  - ui_host_context
required_files:
  - LICENSE
  - config/schema.json
  - config/defaults.json
  - schemas/dashboard-output.json
  - schemas/dashboard-input.json
  - schemas/pricing-input.json
  - schemas/pricing-output.json
  - schemas/settings-output.json
  - schemas/statistics-clear-preview-output.json
  - schemas/statistics-clear-apply-input.json
  - schemas/statistics-clear-apply-output.json
  - ui/index.mjs
  - locales/en.yaml
  - locales/zh-CN.yaml
  - pricing/THIRD_PARTY_NOTICES.md
  - pricing/licenses/CC-SWITCH-MIT.txt
  - pricing/upstream/cc-switch-v3.19.2-model-pricing.v1.json
  - pricing/upstream/official-model-pricing.v1.json
  - pricing/catalog/vulcan-model-pricing.v1.json
execution:
  dependencies:
    manifest: dependencies.yaml
    install_mode: bundled
runtime_requirements:
  protocol_version: 1
  backend: in_process
  core_capabilities:
    - bounded_transports_v1
    - plugin_budgets_v1
    - capacity_groups_v1
    - fixed_sessions_v1
    - strict_json_v1
  host_capabilities:
    - name: vulcan.plugin.config.get
      version: 1.0.0
      execution: native
      scope: invocation
    - name: vulcan.plugin.config.update
      version: 1.0.0
      execution: native
      scope: invocation
    - name: vulcan.vldb.sqlite.query.v1
      version: 1.0.0
      execution: native
      scope: invocation
    - name: vulcan.vldb.sqlite.execute.v1
      version: 1.0.0
      execution: native
      scope: invocation
  capacities: []
lua_runtime:
  bundle: runtime/plugin.bundle.lua
  invoke_function: dispatch
  shutdown_function: shutdown
  max_active_sessions: 8
  session_idle_timeout_sec: 300
  actions:
    - id: pricing-get
      effect: read
      function: pricing_get
      input_schema_file: schemas/pricing-input.json
      output_schema_file: schemas/pricing-output.json
      timeout_ms: 8000
      callers:
        - plugin_ui
    - id: settings-get
      effect: read
      function: settings_get
      output_schema_file: schemas/settings-output.json
      timeout_ms: 5000
      callers:
        - plugin_ui
    - id: settings-update
      effect: mutation
      function: settings_update
      input_schema_file: config/schema.json
      output_schema_file: schemas/settings-output.json
      timeout_ms: 5000
      callers:
        - plugin_ui
    - id: dashboard-get
      effect: read
      snapshot_time_arguments: [endAtMs]
      function: dashboard_get
      input_schema_file: schemas/dashboard-input.json
      output_schema_file: schemas/dashboard-output.json
      timeout_ms: 12000
      callers:
        - plugin_ui
    - id: statistics-clear-preview
      effect: read
      function: statistics_clear_preview
      output_schema_file: schemas/statistics-clear-preview-output.json
      timeout_ms: 8000
      callers:
        - plugin_ui
    - id: statistics-clear-apply
      effect: mutation
      function: statistics_clear_apply
      input_schema_file: schemas/statistics-clear-apply-input.json
      output_schema_file: schemas/statistics-clear-apply-output.json
      timeout_ms: 12000
      callers:
        - plugin_ui
config:
  schema_file: config/schema.json
  defaults_file: config/defaults.json
ui:
  mounts:
    - id: usage-statistics
      point: skills_plugin_detail
      label: Usage Statistics
      label_message_key: navigationLabel
      icon: chart
      entry: ui/index.mjs
      export: createPluginPanel
locales:
  en: locales/en.yaml
  en-US: locales/en.yaml
  zh-CN: locales/zh-CN.yaml
  zh-TW: locales/zh-TW.yaml
  zh-HK: locales/zh-HK.yaml
  ja-JP: locales/ja-JP.yaml
  ko-KR: locales/ko-KR.yaml
  es-ES: locales/es-ES.yaml
  fr-FR: locales/fr-FR.yaml
  de-DE: locales/de-DE.yaml
  pt-BR: locales/pt-BR.yaml
  ru-RU: locales/ru-RU.yaml
