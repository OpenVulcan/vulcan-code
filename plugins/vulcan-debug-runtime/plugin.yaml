schema_version: 2
id: vulcan-debug-runtime
version: 0.1.0
default_enabled: true
display:
  name: Vulcan Debug Runtime
  capability: Managed local CDP and DAP debugging
permissions:
  - process_node
  - process_session
platforms:
  excluded_targets:
    - aarch64-pc-windows-msvc
    - arm64ec-pc-windows-msvc
required_files:
  - node/sidecar.mjs
  - node/package.json
  - node/pnpm-lock.yaml
execution:
  dependencies:
    manifest: dependencies.yaml
    install_mode: bundled
  node_entries:
    - id: debug-sidecar
      file: node/sidecar.mjs
      cwd: node
runtime_requirements:
  protocol_version: 1
  backend: in_process
  core_capabilities:
    - bounded_transports_v1
    - plugin_budgets_v1
    - capacity_groups_v1
    - fixed_sessions_v1
    - strict_json_v1
  host_capabilities:
    - name: vulcan.plugin.process.resolve
      version: 1.0.0
      execution: native
      scope: invocation
  capacities: []
lua_runtime:
  bundle: runtime/plugin.bundle.lua
  invoke_function: dispatch
  shutdown_function: shutdown
  max_active_sessions: 8
  session_idle_timeout_sec: 1800
  tools:
    - id: debug_session_open
      group: debug_session_tools
      description: Open a managed local CDP or DAP debug session.
      parameters_file: schemas/debug_session_open.json
      available_in_plan: false
      execution:
        kind: session_open
        operation: open
        timeout_ms: 30000
    - id: debug_session_request
      group: debug_session_tools
      description: Send one CDP method, DAP command, or DAP reverse-request response through an owned debug session.
      parameters_file: schemas/debug_session_request.json
      available_in_plan: false
      execution:
        kind: session_call
        operation: request
        timeout_ms: 30000
        timeout_argument: timeout_ms
        max_timeout_ms: 60000
        timeout_grace_ms: 5000
    - id: debug_session_events
      group: debug_session_tools
      description: Read a bounded page of retained events from an owned debug session.
      parameters_file: schemas/debug_session_events.json
      available_in_plan: false
      execution:
        kind: session_call
        operation: events
        timeout_ms: 0
        timeout_argument: timeout_ms
        max_timeout_ms: 10000
        timeout_grace_ms: 5000
    - id: debug_session_status
      group: debug_session_tools
      description: Read transport and buffered-event status for an owned debug session.
      parameters_file: schemas/debug_session_status.json
      available_in_plan: false
      execution:
        kind: session_call
        operation: status
        timeout_ms: 5000
    - id: debug_session_close
      group: debug_session_tools
      description: Close an owned debug session and retire its managed runtime process.
      parameters_file: schemas/debug_session_close.json
      available_in_plan: false
      execution:
        kind: session_close
        operation: close
        timeout_ms: 5000
prompt_contributions:
  - id: debug-session-workflow
    file: model/instructions.md
    required_tools:
      - debug_session_open
      - debug_session_request
      - debug_session_events
      - debug_session_status
      - debug_session_close
locales:
  en: locales/en.yaml
  en-US: locales/en.yaml
  zh-CN: locales/zh-CN.yaml
  zh-TW: locales/zh-TW.yaml
  zh-HK: locales/zh-HK.yaml
  ja-JP: locales/ja-JP.yaml
  ko-KR: locales/ko-KR.yaml
  es-ES: locales/es-ES.yaml
  fr-FR: locales/fr-FR.yaml
  de-DE: locales/de-DE.yaml
  pt-BR: locales/pt-BR.yaml
  ru-RU: locales/ru-RU.yaml
