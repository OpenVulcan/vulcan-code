schema_version: 2
id: vulcan-rtk
version: 0.1.0
default_enabled: true
display:
  name: Vulcan RTK
  capability: Command routing, compressed Git context, and token-saving statistics
permissions:
  - process_binary
  - config
  - ui_host_context
platforms:
  excluded_targets:
    - aarch64-pc-windows-msvc
    - arm64ec-pc-windows-msvc
required_files:
  - LICENSE
  - config/schema.json
  - config/defaults.json
  - ui/settings.json
  - locales/en.yaml
  - locales/zh-CN.yaml
  - locales/zh-TW.yaml
  - locales/zh-HK.yaml
  - locales/ja-JP.yaml
  - locales/ko-KR.yaml
  - locales/es-ES.yaml
  - locales/fr-FR.yaml
  - locales/de-DE.yaml
  - locales/pt-BR.yaml
  - locales/ru-RU.yaml
execution:
  dependencies:
    manifest: dependencies.yaml
    install_mode: bundled
  native_binaries:
    - id: rtk
      targets:
        x86_64-pc-windows-msvc: bin/x86_64-pc-windows-msvc/rtk.exe
        x86_64-unknown-linux-gnu: bin/x86_64-unknown-linux-gnu/rtk
        aarch64-unknown-linux-gnu: bin/aarch64-unknown-linux-gnu/rtk
        x86_64-apple-darwin: bin/x86_64-apple-darwin/rtk
        aarch64-apple-darwin: bin/aarch64-apple-darwin/rtk
      allowed_env:
        - RTK_TELEMETRY_DISABLED
      allow_workspace_cwd: true
runtime_requirements:
  protocol_version: 1
  backend: in_process
  core_capabilities:
    - bounded_transports_v1
    - plugin_budgets_v1
    - capacity_groups_v1
    - fixed_sessions_v1
    - strict_json_v1
  host_capabilities:
    - name: vulcan.plugin.process.resolve
      version: 1.0.0
      execution: native
      scope: invocation
    - name: vulcan.plugin.config.get
      version: 1.0.0
      execution: native
      scope: invocation
    - name: vulcan.plugin.config.update
      version: 1.0.0
      execution: native
      scope: invocation
  capacities: []
lua_runtime:
  bundle: runtime/plugin.bundle.lua
  invoke_function: dispatch
  shutdown_function: shutdown
  max_active_sessions: 8
  session_idle_timeout_sec: 300
  actions:
    - id: settings-get
      effect: read
      function: settings_get
      output_schema_file: schemas/settings-output.json
      timeout_ms: 5000
      callers:
        - plugin_ui
    - id: settings-update
      effect: mutation
      function: settings_update
      input_schema_file: config/schema.json
      output_schema_file: schemas/settings-output.json
      timeout_ms: 5000
      callers:
        - plugin_ui
    - id: statistics-get
      effect: read
      result_cache_ms: 1800000
      function: statistics_get
      output_schema_file: schemas/statistics-output.json
      # Two back-to-back `rtk gain` runs of STATISTICS_PROCESS_TIMEOUT_MS each, plus setup headroom.
      # 两次连续的 `rtk gain`（各 STATISTICS_PROCESS_TIMEOUT_MS），另留准备余量。
      timeout_ms: 125000
      callers:
        - plugin_ui
    - id: self_check
      effect: read
      function: self_check
      output_schema_file: schemas/self-check-output.json
      timeout_ms: 5000
      callers:
        - plugin_ui
  hooks:
    - id: shell-command-rewrite
      point: tool.shell_command.before_execute
      mode: transform
      scope: workspace
      function: transform_shell_command
      priority: 100
      timeout_ms: 3000
      failure_policy: continue
      display_name: RTK command routing
      progress_label: Rewriting command with RTK
    - id: git-commit-context
      point: git.commit_summary.context
      mode: transform
      scope: workspace
      function: transform_git_commit_context
      priority: 100
      timeout_ms: 12000
      failure_policy: continue
      display_name: RTK Git context compression
      progress_label: Compressing Git context with RTK
config:
  schema_file: config/schema.json
  defaults_file: config/defaults.json
ui:
  mounts:
    - id: rtk-settings
      point: skills_plugin_detail
      label: RTK Settings
      label_message_key: navigationLabel
      icon: route
      kind: settings
      entry: ui/settings.json
locales:
  en: locales/en.yaml
  en-US: locales/en.yaml
  zh-CN: locales/zh-CN.yaml
  zh-TW: locales/zh-TW.yaml
  zh-HK: locales/zh-HK.yaml
  ja-JP: locales/ja-JP.yaml
  ko-KR: locales/ko-KR.yaml
  es-ES: locales/es-ES.yaml
  fr-FR: locales/fr-FR.yaml
  de-DE: locales/de-DE.yaml
  pt-BR: locales/pt-BR.yaml
  ru-RU: locales/ru-RU.yaml
