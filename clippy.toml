# User paths start from vulcan_runtime_assets::user_home_dir, which gives test builds a private home.
# 用户路径从 vulcan_runtime_assets::user_home_dir 开始，它为测试构建提供私有主目录。
disallowed-methods = [
    { path = "dirs::home_dir", reason = "use vulcan_runtime_assets::user_home_dir so test builds never touch the real user's files", allow-invalid = true },
]

# Tests state their preconditions with unwrap/expect; the workspace `unwrap_used` lint targets
# production paths only. Clippy reads the nearest clippy.toml without merging, so crates with
# their own file repeat these two keys.
# 测试用 unwrap/expect 声明前置条件；工作区 `unwrap_used` 只针对生产路径。Clippy 只读取最近的
# clippy.toml 且不合并，因此拥有独立文件的 crate 需重复这两个键。
allow-unwrap-in-tests = true
allow-expect-in-tests = true
