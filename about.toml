targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

private = { ignore = true }

# Test-only dependencies never reach a distributed binary, so notices skip them.
# Build dependencies stay in scope: crates such as lua-src and luajit-src compile vendored C sources into it.
# 仅测试使用的依赖不会进入分发二进制，因此声明跳过它们。
# 构建依赖保留在范围内：lua-src、luajit-src 等 crate 会把内置 C 源码编译进二进制。
ignore-dev-dependencies = true

accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
