[package]
name = "vulcan-code-mode-runtime"
description = "V8 JavaScript runtime for code-mode cells, vendored from OpenAI Codex. Linked only by vulcan-code-mode-host."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lib]
doctest = false

[lints.rust]
# The V8 bindings require unsafe FFI calls, exactly as upstream.
unsafe_code = "allow"

# Vendored from openai/codex: mirror the upstream clippy policy instead of the Vulcan workspace lints.
[lints.clippy]
dbg_macro = "warn"
todo = "warn"
expect_used = "deny"
unwrap_used = "deny"

[dependencies]
base64.workspace = true
deno_core_icudata.workspace = true
futures.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true
v8 = { workspace = true, features = ["v8_enable_sandbox"] }
vulcan-code-mode-protocol.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
tokio = { workspace = true, features = ["test-util"] }
