# Cargo merges this file over the repository root .cargo/config.toml whenever cargo runs from this
# directory: `[build] jobs`, RUST_TEST_THREADS, PROTOC, the rust-lld linker and the MSVC
# /NOIMPLIB /NOEXP flags are inherited from there unchanged.
# 在本目录下运行 cargo 时，Cargo 会把本文件叠加到仓库根 .cargo/config.toml 之上：`[build] jobs`、
# RUST_TEST_THREADS、PROTOC、rust-lld 链接器以及 MSVC /NOIMPLIB /NOEXP 参数均原样继承自根配置。

# A separate target directory keeps static-CRT artifacts away from the root workspace's dynamic-CRT
# ones. Relative paths resolve against the directory that contains this .cargo directory.
# 独立目标目录使静态 CRT 产物与根工作区的动态 CRT 产物互不混用。相对路径基于包含本 .cargo 目录的目录解析。
[build]
target-dir = "../../target/code-mode-host"

[env]
# The sandbox-enabled V8 archives embed Chromium's allocator shim, which replaces malloc and free and
# therefore requires the static C runtime; C sources built by cc must use /MT to match. `force`
# overrides the root workspace's /MD default.
# 启用沙盒的 V8 预编译库内嵌替换 malloc 与 free 的 Chromium 分配器垫片，因而要求静态 C 运行时；
# 由 cc 编译的 C 源码必须使用 /MT 与之匹配。`force` 覆盖根工作区的 /MD 默认值。
CL = { value = "/MT", force = true }

# The code-mode runtime requires a sandbox-enabled V8 (`v8_enable_sandbox`). denoland/rusty_v8 does
# not publish those prebuilt archives for every target (Windows MSVC among them); OpenAI Codex
# publishes the full set for each v8 crate version under its `rusty-v8-v<version>` release tag.
# `{version}` expands to the locked v8 crate version, so the tag never repeats Cargo.toml. Without
# RUSTY_V8_MIRROR_FALLBACK the build fails closed instead of reaching another host.
# 代码模式运行时需要启用沙盒的 V8（`v8_enable_sandbox`）。denoland/rusty_v8 并未为所有目标（包括
# Windows MSVC）发布此类预编译库；OpenAI Codex 在 `rusty-v8-v<版本>` 发布标签下为每个 v8 crate 版本发布
# 完整集合。`{version}` 展开为锁定的 v8 crate 版本，标签不重复 Cargo.toml。未设置
# RUSTY_V8_MIRROR_FALLBACK，失败时直接报错而不会访问其他主机。
RUSTY_V8_MIRROR = { value = "https://github.com/openai/codex/releases/download/rusty-v8-v{version}/{file}", force = false }

# Upstream Codex links every MSVC binary with the static C runtime for the same V8 archives.
# 上游 Codex 为同一批 V8 预编译库以静态 C 运行时链接全部 MSVC 二进制。
[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "target-feature=+crt-static"]
