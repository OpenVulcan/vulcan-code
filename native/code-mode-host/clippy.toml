# Clippy settings copied from openai/codex codex-rs/clippy.toml at
# c419fd01a70dd1d05356da443ac44328bda2e6f4 (Apache-2.0), keeping only the keys that apply to the
# vendored host and runtime. The vendored tests rely on `await-holding-invalid-types` through
# `#[expect(clippy::await_holding_invalid_type)]`. Clippy reads the nearest clippy.toml without
# merging, so the repository root file does not apply here.
# 复制自 openai/codex codex-rs/clippy.toml（提交 c419fd01a70dd1d05356da443ac44328bda2e6f4，Apache-2.0），
# 只保留适用于内置宿主与运行时的键。内置测试通过 `#[expect(clippy::await_holding_invalid_type)]`
# 依赖 `await-holding-invalid-types`。Clippy 只读取最近的 clippy.toml 且不合并，因此仓库根文件不作用于此。
allow-expect-in-tests = true
allow-unwrap-in-tests = true
await-holding-invalid-types = [
    "tokio::sync::MutexGuard",
    "tokio::sync::RwLockReadGuard",
    "tokio::sync::RwLockWriteGuard",
]
large-error-threshold = 256
