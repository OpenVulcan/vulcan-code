[package]
name = "vulcan-code-mode-host"
description = "Isolated code-mode host process serving V8 cells over gRPC, vendored from OpenAI Codex."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "vulcan-code-mode-host"
path = "src/main.rs"

[lib]
doctest = false
name = "vulcan_code_mode_host"
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"

# Vendored from openai/codex: mirror the upstream clippy policy instead of the Vulcan workspace
# lints, whose `missing_docs` requirement the upstream sources do not follow.
[lints.clippy]
dbg_macro = "warn"
todo = "warn"
expect_used = "deny"
unwrap_used = "deny"

[dependencies]
anyhow.workspace = true
axum = { workspace = true, features = ["http1", "tokio", "ws"] }
clap.workspace = true
futures.workspace = true
prost.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-stream.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
tonic = { workspace = true, features = ["router", "transport"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
vulcan-code-mode-protocol.workspace = true
vulcan-code-mode-runtime.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
tempfile.workspace = true
vulcan-code-mode.workspace = true
